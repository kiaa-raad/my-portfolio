const PLAY_ICON = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg>';

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const calm = ()=> matchMedia('(prefers-reduced-motion:reduce)').matches;

/* A cover image if the folder has one, else a video, else procedural artwork. */
/* ── image ratios ─────────────────────────────────────
   A frame that knows the file's shape before it paints never jumps. Ratios
   are measured once per src, off-DOM, and cached — so by the time a project
   opens, its boxes are already the right shape. */
const AR = new Map();          // src -> "w/h"
const AR_WAIT = new Map();     // src -> promise, so a src is measured once

const arVar = src => AR.has(src) ? ' style="--media-ar:' + AR.get(src) + '"' : '';

/* Record a ratio from an <img> that is already on the page (a grid thumb, say)
   — the file is downloaded either way, so this costs nothing. */
function noteAR(img, src){
  if(!img || !src || AR.has(src)) return;
  const grab = ()=>{
    if(img.naturalWidth && img.naturalHeight)
      AR.set(src, img.naturalWidth + '/' + img.naturalHeight);
  };
  if(img.complete) grab(); else img.addEventListener('load', grab, { once:true });
}

function measureAR(src){
  if(!src) return Promise.resolve('');
  if(AR.has(src)) return Promise.resolve(AR.get(src));
  if(AR_WAIT.has(src)) return AR_WAIT.get(src);

  const p = new Promise(res=>{
    const im = new Image();
    im.decoding = 'async';
    const grab = ()=>{
      if(!im.naturalWidth || !im.naturalHeight) return false;
      const ar = im.naturalWidth + '/' + im.naturalHeight;
      AR.set(src, ar); res(ar); return true;
    };
    /* Dimensions sit in the file header, so they are readable long before the
       last byte lands — polling gets them frames earlier than `load` would. */
    const poll = ()=>{
      if(grab()) return;
      if(im.complete) res('');
      else requestAnimationFrame(poll);
    };
    im.onload  = ()=>{ if(!grab()) res(''); };
    im.onerror = ()=>res('');
    im.src = src;
    requestAnimationFrame(poll);
  });

  AR_WAIT.set(src, p);
  return p;
}

const warmAR = list => (list || []).filter(Boolean).forEach(measureAR);

/* Everything a project will show, warmed the moment the card is touched. */
const warmWork = w => { if(w) warmAR([w.img].concat(w.gallery || [])); };

/* Covers for the whole index, once the browser is otherwise idle. */
function warmCovers(){
  idle(()=>{
    const covers = [];
    FIELDS.forEach(f => (f.works || []).forEach(w => { if(w.img) covers.push(w.img); }));
    warmAR(covers);
  });
}

/* Give `frame` the ratio of `src`: instantly when it is known, otherwise as
   soon as the header arrives. `token` guards against a fast click-through
   landing an old measurement on the new project. */
function applyAR(frame, src, token){
  if(!src) return;
  if(AR.has(src)){ frame.style.setProperty('--media-ar', AR.get(src)); return; }
  frame.classList.add('ar-soft');       // let the correction ease in, not snap
  measureAR(src).then(ar=>{
    if(ar && frame.dataset.arToken === token) frame.style.setProperty('--media-ar', ar);
  });
}

/* Fade the picture in over its own frame instead of popping it into place. */
function revealOnLoad(img, frame){
  const done = ()=>{ img.classList.add('ready'); if(frame) frame.classList.remove('skel'); };
  if(img.complete && img.naturalWidth) done();
  else{
    img.addEventListener('load', done, { once:true });
    img.addEventListener('error', done, { once:true });
  }
}

function workMedia(w, f, seed, thumb){
  if(w.img){
    return '<img src="'+esc(w.img)+'" alt="'+esc(w.t)+'"' +
      (thumb ? ' loading="lazy"' : '') + ' decoding="async">';
  }
  if(w.video){
    return '<video src="'+esc(w.video)+'" muted loop playsinline preload="metadata"' +
      (calm() ? '' : ' autoplay') + (thumb ? '' : ' controls') + '></video>';
  }
  return art(f.kind, seed);
}
const chips_ = list => list.map(x=>'<span>'+x+'</span>').join('');

function workInfo(w){
  let h = '';
  if(w.b) h += '<div><b>'+(w.lb||'BRIEF')+'</b><p>'+w.b+'</p></div>';
  if(w.a || w.credit){
    h += '<div><b>'+(w.la||'APPROACH')+'</b>' +
      (w.a ? '<p>'+w.a+'</p>' : '') +
      (w.credit ? '<p>'+w.credit+'</p>' : '') +
    '</div>';
  }
  const clientList = (w.clients && w.clients.length) ? w.clients : (w.c ? [w.c] : []);
  if(clientList.length) h += '<div><b>CLIENT'+(clientList.length > 1 ? 'S' : '')+
    '</b><div class="tags">'+chips_(clientList)+'</div></div>';
  if(w.roles)   h += '<div><b>ROLE</b><div class="tags">'+chips_(w.roles)+'</div></div>';

  const row =
    (w.y ? '<div><b>YEAR</b><p>'+esc(w.y)+'</p></div>' : '') +
    (!w.roles && w.r ? '<div><b>ROLE</b><p>'+esc(w.r)+'</p></div>' : '');
  if(row) h += '<div class="row">'+row+'</div>';

  return h;
}

function openWork(k){
  const f = FIELDS[fieldIx], w = f.works[k];
  workIx = k;

  const media = workMedia(w, f, fieldIx*97 + k*13 + 5, false);
  const play = w.link
    ? '<a class="play" href="'+w.link+'" target="_blank" rel="noopener" data-tag="PLAY">'+PLAY_ICON+'WATCH</a>'
    : '';
  const dimg = document.getElementById('detailimg');
  haltMedia(dimg);
  dimg.innerHTML = media + play;
  const pl = dimg.querySelector('.play');
  if(pl) pl.addEventListener('pointerenter', ()=>blip(1320, 0.03));

  /* Video projects size their frame to the footage, not to the still-image
     box, so 16:9 motion work is shown whole. */
  const vid = dimg.querySelector('video');
  dimg.classList.toggle('is-video', !!vid);
  dimg.style.removeProperty('--media-ar');
  if(vid){
    const fitFrame = ()=>{
      if(vid.videoWidth && vid.videoHeight){
        dimg.style.setProperty('--media-ar', vid.videoWidth + '/' + vid.videoHeight);
      }
    };
    vid.addEventListener('loadedmetadata', fitFrame);
    fitFrame();
  }

  /* Stills do the same: the cover keeps its own ratio, portrait or landscape.
     The ratio is usually already cached from the grid thumb, so the frame is
     the right shape on its first paint. */
  const cover = dimg.querySelector('img');
  dimg.classList.remove('ar-soft', 'skel');
  dimg.classList.toggle('is-img', !!cover);
  dimg.dataset.arToken = String(fieldIx) + ':' + String(k);
  if(cover){
    applyAR(dimg, w.img, dimg.dataset.arToken);
    dimg.classList.add('skel');
    revealOnLoad(cover, dimg);
  }

  watchVideo(vid);

  /* the cover leads, then everything else in the folder */
  const shots = (w.img ? [w.img] : []).concat(w.gallery || []);

  const hero = w.img ? dimg.querySelector('img') : null;
  if(hero && shots.length){
    const open = ()=>openLens(shots, 0, w.t);
    hero.dataset.tag = 'VIEW';
    hero.setAttribute('role', 'button');
    hero.setAttribute('tabindex', '0');
    hero.addEventListener('click', open);
    hero.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
    });
  }

  document.getElementById('detailtitle').textContent = w.t;
  document.getElementById('detailtag').textContent = w.tag
    || (f.key + ' / ' + w.y + ' / ' + String(k+1).padStart(2,'0') + ' OF ' + String(f.works.length).padStart(2,'0'));
  document.getElementById('detailinfo').innerHTML = workInfo(w);

  const gal = document.getElementById('detailgal');
  const rest = w.gallery || [];
  const offset = w.img ? 1 : 0;
  gal.hidden = rest.length === 0;
  /* A cached ratio is written straight into the markup, so the tile is born
     the right shape — nothing to correct afterwards. */
  gal.innerHTML = rest.map((src,n)=>
    '<button class="gshot skel" type="button" data-tag="VIEW"'+arVar(src)+
      ' aria-label="View image '+(n+1+offset)+'">' +
      '<img src="'+esc(src)+'" alt="'+esc(w.t)+' \u2014 '+(n+1+offset)+'" decoding="async">' +
    '</button>'
  ).join('');
  gal.querySelectorAll('button').forEach((btn,n)=>{
    const src = rest[n], im = btn.querySelector('img');
    btn.dataset.arToken = dimg.dataset.arToken + ':' + n;
    applyAR(btn, src, btn.dataset.arToken);
    revealOnLoad(im, btn);
    noteAR(im, src);
    btn.addEventListener('pointerenter', ()=>blip(1180, 0.026));
    btn.addEventListener('click', ()=>openLens(shots, n + offset, w.t));
  });

  /* PREV / NEXT should land as cleanly as the first open */
  warmWork(f.works[(k + 1) % f.works.length]);
  warmWork(f.works[(k - 1 + f.works.length) % f.works.length]);

  gridView.classList.add('hide');
  detailView.classList.remove('hide');
  detailView.scrollTop = 0;
  pBack.hidden = false;
  pPrev.hidden = pNext.hidden = f.works.length < 2;
  blip(1420, 0.045);
}

function stepWork(d){
  const n = FIELDS[fieldIx].works.length;
  openWork((workIx + d + n) % n);
}

function closePanel(){
  panelOpen = false;
  panel.classList.remove('on');
  panel.setAttribute('aria-hidden','true');
  haltMedia(panel);
  showGrid();
  refreshExplore();          // without this the chip strip stays hidden on touch
  blip(640, 0.045);
}

pNext.addEventListener('click', ()=>stepWork(1));

  b.addEventListener('click', ()=>{ startAudio(); openPage(b.dataset.page); }));
/* ══ lightbox ═════════════════════════════════════════════════════════════
   Tapping any project image lifts it out of the panel: the backdrop dims,
   the image scales up, and arrows or a swipe move through the rest of the
   folder. */
const lens = document.getElementById('lens');
const lensBg = document.getElementById('lensbg');
const lensImg = document.getElementById('lensimg');
const lensClose = document.getElementById('lensclose');
const lensPrev = document.getElementById('lensprev');
const lensNext = document.getElementById('lensnext');
const lensCount = document.getElementById('lenscount');
const lensNow = document.getElementById('lensnow');
const lensTotal = document.getElementById('lenstotal');

let lensSet = [], lensIx = 0, lensName = '', lensSwap = null;
const lensOpen = ()=> !lens.hidden;

function paintLens(){
  const many = lensSet.length > 1;
  lensPrev.hidden = lensNext.hidden = lensCount.hidden = !many;
  lensNow.textContent = String(lensIx + 1).padStart(2,'0');
  lensTotal.textContent = String(lensSet.length).padStart(2,'0');
}

function showShot(){
  lensImg.src = lensSet[lensIx];
  lensImg.alt = lensName + ' \u2014 ' + (lensIx + 1) + ' of ' + lensSet.length;
}

function openLens(set, i, name){
  if(!set || !set.length) return;
  zClear();                           // a new picture always opens squared up
  lensSet = set;
  lensIx = Math.max(0, Math.min(i | 0, set.length - 1));
  lensName = name || '';
  lens.hidden = false;
  showShot();
  paintLens();
  // one frame on screen before the transition, or it has nothing to run from
  requestAnimationFrame(()=>requestAnimationFrame(()=>lens.classList.add('on')));
  lensClose.focus({ preventScroll:true });
  blip(1380, 0.04);
}

function stepLens(d){
  if(lensSet.length < 2) return;
  lensIx = (lensIx + d + lensSet.length) % lensSet.length;
  zReset(true);                       // the one you were reading squares up as it goes
  paintLens();
  clearTimeout(lensSwap);
  lensImg.classList.add('swap');
  lensSwap = setTimeout(()=>{ showShot(); lensImg.classList.remove('swap'); }, 150);
  blip(1180, 0.03);
}

function closeLens(){
  if(!lensOpen()) return;
  zReset(true);
  lens.classList.remove('on');
  clearTimeout(lensSwap);
  setTimeout(()=>{
    lens.hidden = true;
    lensImg.removeAttribute('src');   // never leave a broken frame behind
    lensImg.classList.remove('swap');
  }, 320);
  blip(720, 0.04);
}

lensClose.addEventListener('click', closeLens);
lensPrev.addEventListener('click', ()=>stepLens(-1));
lensNext.addEventListener('click', ()=>stepLens(1));
[lensClose, lensPrev, lensNext].forEach(b=>
  b.addEventListener('pointerenter', ()=>blip(1240, 0.03)));

/* the wheel steps through the set, one image per gesture rather than per tick */
let lensWheel = 0;
lens.addEventListener('wheel', e=>{
  if(!lensOpen()) return;
  e.preventDefault();
  const now = performance.now();
  if(now - lensWheel < 260) return;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(Math.abs(d) < 4) return;
  lensWheel = now;
  stepLens(d > 0 ? 1 : -1);
}, { passive:false });

/* ── pinch to zoom, swipe to move, tap to dismiss ────────────────────────
   Three readings of one surface, and they must never overlap. Two fingers
   push the photo in, scaling it about the point held between them; once it
   is larger than the screen a single finger moves it around; at rest a
   sideways flick steps the folder and a tap on the backdrop closes.

   The zoom is run here rather than handed to the browser's own pinch, which
   would scale the entire overlay — chrome, backdrop, counter and all — and
   leave the visitor stranded at 3x with no way to square it up again. This
   way only the photograph moves, and letting go always leaves the interface
   where it was. */
const lensStage = document.querySelector('.lens-stage');
const ZMAX = 4;                                  // far enough in to read grain
let zS = 1, zX = 0, zY = 0;                      // scale, and offset in px
const zPts = new Map();                          // every finger on the sheet
let zGest = null, lensSwipe = null;

const zoomed = ()=> zS > 1.01;

function zApply(ease){
  lensStage.classList.toggle('live', !ease);     // no easing under the fingers
  lensStage.classList.toggle('zoom', zoomed());
  lensImg.style.transform = (zS === 1 && !zX && !zY)
    ? ''                                         // hand the frame back to the CSS
    : 'translate3d(' + zX + 'px,' + zY + 'px,0) scale(' + zS + ')';
}

// the photo may be moved only as far as its own edges — never past them
function zClamp(){
  const mx = Math.max(0, (lensImg.clientWidth  * zS - innerWidth)  / 2);
  const my = Math.max(0, (lensImg.clientHeight * zS - innerHeight) / 2);
  zX = Math.max(-mx, Math.min(mx, zX));
  zY = Math.max(-my, Math.min(my, zY));
}

let zSettle = null;

// straight back to fit with no animation and no leftover state — for opening,
// where the lift-in needs the stylesheet's own transition left alone
function zClear(){
  clearTimeout(zSettle);
  zS = 1; zX = 0; zY = 0; zGest = null;
  zPts.clear(); lensSwipe = null;
  lensStage.classList.remove('live', 'zoom');
  lensImg.style.transform = '';
}

function zReset(ease){
  const was = zoomed();
  clearTimeout(zSettle);
  zS = 1; zX = 0; zY = 0; zGest = null;
  if(ease !== false && was){
    // hold the quick curve until the photo has actually landed back on fit,
    // then let go of it so the open and swap animations get their own timing
    lensStage.classList.remove('live');
    lensStage.classList.add('zoom');
    lensImg.style.transform = '';
    zSettle = setTimeout(()=>lensStage.classList.remove('zoom'), 340);
    return;
  }
  zApply(ease !== false);
}

lens.addEventListener('pointerdown', e=>{
  if(e.target.closest('.lens-btn')) return;      // let the buttons be buttons
  zPts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  // fingers are captured so a gesture that wanders off the photo keeps
  // reporting; a mouse is left alone, so the desktop path is untouched
  if(e.pointerType !== 'mouse'){ try{ lens.setPointerCapture(e.pointerId); }catch(err){} }

  if(zPts.size === 2){                           // a second finger is a pinch,
    lensSwipe = null;                            // and never a swipe or a tap
    const [a, b] = [...zPts.values()];
    zGest = { kind:'pinch', s0:zS, x0:zX, y0:zY,
              d0:Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
              mx:(a.x + b.x)/2, my:(a.y + b.y)/2 };
    return;
  }
  if(zPts.size > 2){ zGest = null; lensSwipe = null; return; }

  zGest = zoomed() ? { kind:'pan', px:e.clientX, py:e.clientY, x0:zX, y0:zY } : null;
  lensSwipe = { x:e.clientX, y:e.clientY, moved:false, on:e.target };
});

lens.addEventListener('pointermove', e=>{
  const p = zPts.get(e.pointerId);
  if(p){ p.x = e.clientX; p.y = e.clientY; }
  if(lensSwipe && Math.abs(e.clientX - lensSwipe.x) > 10) lensSwipe.moved = true;
  if(!zGest) return;

  if(zGest.kind === 'pinch' && zPts.size >= 2){
    const [a, b] = [...zPts.values()];
    const d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
    const s = Math.max(1, Math.min(ZMAX, zGest.s0 * (d / zGest.d0)));
    // the point between the fingers is the anchor: work out where it sits on
    // the photograph itself, then place the photograph so it stays under them
    const cx = innerWidth/2, cy = innerHeight/2;
    const ux = (zGest.mx - cx - zGest.x0) / zGest.s0;
    const uy = (zGest.my - cy - zGest.y0) / zGest.s0;
    zS = s;
    zX = (a.x + b.x)/2 - cx - s*ux;
    zY = (a.y + b.y)/2 - cy - s*uy;
    zClamp(); zApply(false);
    return;
  }
  if(zGest.kind === 'pan'){
    zX = zGest.x0 + (e.clientX - zGest.px);
    zY = zGest.y0 + (e.clientY - zGest.py);
    zClamp(); zApply(false);
  }
}, { passive:true });

function lensLetGo(e){
  const many = zPts.size > 1;
  zPts.delete(e.pointerId);
  try{ if(lens.hasPointerCapture(e.pointerId)) lens.releasePointerCapture(e.pointerId); }catch(err){}

  if(many){                                      // coming out of a pinch
    zGest = null; lensSwipe = null;
    if(zS <= 1.02) zReset(true); else { zClamp(); zApply(true); }
    // a finger still down carries straight on into a move, from where it is,
    // so the photo doesn't jump the moment the other one lifts
    if(zPts.size === 1 && zoomed()){
      const [q] = [...zPts.values()];
      zGest = { kind:'pan', px:q.x, py:q.y, x0:zX, y0:zY };
    }
    return;
  }

  const sw = lensSwipe;
  zGest = null; lensSwipe = null;
  if(!sw || e.type === 'pointercancel'){ if(zoomed()){ zClamp(); zApply(true); } return; }

  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  const tap = !sw.moved && Math.abs(dx) < 10 && Math.abs(dy) < 10;

  // while the photo is in close, everything answers to the zoom: a tap squares
  // it back up rather than closing, so no one can be stranded at 4x, and a
  // drag has already moved it and wants no second reading
  if(zoomed()){
    if(tap) zReset(true); else { zClamp(); zApply(true); }
    return;
  }
  // horizontal intent only, so a vertical flick doesn't jump the image
  if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ stepLens(dx < 0 ? 1 : -1); return; }
  if(tap && (sw.on === lensBg || sw.on === lens)) closeLens();
}
lens.addEventListener('pointerup', lensLetGo);
lens.addEventListener('pointercancel', lensLetGo);

/* Safari on iOS will happily run its own page zoom on top of this one, which
   would scale the whole overlay and leave no way back. These are WebKit's own
   gesture events, and they are only ever headed off over the lightbox — the
   rest of the page can still be pinched by anyone who needs to read it. */
['gesturestart','gesturechange','gestureend'].forEach(t=>
  lens.addEventListener(t, e=>{ if(lensOpen()) e.preventDefault(); }, { passive:false }));
lens.addEventListener('touchmove', e=>{
  if(lensOpen() && e.touches.length > 1) e.preventDefault();
}, { passive:false });

// a turned phone changes what "as far as its own edges" means
addEventListener('resize', ()=>{ if(lensOpen() && zoomed()){ zClamp(); zApply(true); } });

/* ══ the photographs are not for taking ═══════════════════════════════════
   Right-click on the desktop and the press-and-hold callout on a phone both
   go nowhere over an image or over the lightbox — no "save image", no drag
   to the desktop, no selection. Worth being straight about what this is: a
   lock on the front door. The browser still has to fetch the files to draw
   them, so anyone who knows their way around devtools or the network tab can
   still get at them. What it does stop is the casual, thoughtless save, and
   that is nearly all of it. */
document.addEventListener('contextmenu', e=>{
  const t = e.target;
  if(t.closest && (t.closest('img') || t.closest('.lens') || t.closest('.thumb,.shot,.gal,.client')))
    e.preventDefault();
}, { capture:true });

document.addEventListener('dragstart', e=>{
  if(e.target && e.target.tagName === 'IMG') e.preventDefault();
});

addEventListener('keydown', e=>{
  if(lensOpen()){                       // the lightbox is on top, so it answers first
    if(e.key === 'Escape'){ closeLens(); return; }
    if(e.key === 'ArrowRight'){ stepLens(1); return; }
    if(e.key === 'ArrowLeft'){ stepLens(-1); return; }
    return;
  }
  if(e.key === 'Escape' && panelOpen){ workIx >= 0 ? showGrid() : closePanel(); }
  if(panelOpen && workIx >= 0){
    if(e.key === 'ArrowRight') stepWork(1);
    if(e.key === 'ArrowLeft')  stepWork(-1);
  }
});

/* ══ pointer, reticle, interface ══════════════════════════════════════════ */
const ret = document.getElementById('ret');
const retTag = document.getElementById('rettag');
const fpsOut = document.getElementById('fps');

/* Fullscreen is the one state where the site's own cursor cannot follow: the
   video is painted over the whole page, reticle included. The CSS hands the
   real pointer back; this puts the reticle away while it is gone, so nothing
   is chasing a cursor nobody can see, and returns it on the way out. The
   body flag exists because the fullscreen pseudo-classes are inconsistently
   applied to media elements across engines — the class is not. */
const fsOn = ()=> !!(document.fullscreenElement || document.webkitFullscreenElement);
let retWasOn = false;

function syncFullscreen(){
  const on = fsOn();
  document.body.classList.toggle('fs', on);
  if(on){
    retWasOn = ret.classList.contains('on');
    ret.classList.remove('on');
  }else if(retWasOn){
    retWasOn = false;
    ret.classList.add('on');
  }
}
document.addEventListener('fullscreenchange', syncFullscreen);
document.addEventListener('webkitfullscreenchange', syncFullscreen);

const raycaster = new THREE.Raycaster();
const ndcPt = new THREE.Vector2();
const target = new THREE.Vector3();
let reveal = 0;   // how open the wireframe reveal is — mouse hover only, never touch
const ndc = new THREE.Vector3();
let mx=0, my=0, px=0, py=0, touched=false, clock=0, intro=0, radius=0, rGoal=0;
let pointerX = innerWidth/2, pointerY = innerHeight/2, retX = pointerX, retY = pointerY;
let VX = 0, VY = 0, VW = innerWidth, VH = innerHeight, visH = 4.5, centreY = 0, formScale = 1, formScaleGoal = 1;
let letterW = 2.1, letterH = FIT;
const cxMid = ()=> VX + VW/2;
const cyMid = ()=> VY + VH/2;
let spin = 0, spinV = 0, groupX = 0;

// the reticle invites you in, then tells you what a tap will do
function syncTag(){
  retTag.textContent = hoverForm ? (started ? 'MORPH' : 'INTERACT') : '';
}

function toWorld(cx, cy){
  ndc.set(((cx - VX)/VW)*2-1, -((cy - VY)/VH)*2+1, 0.5).unproject(camera);
  ndc.sub(camera.position).normalize();
  return camera.position.clone().addScaledVector(ndc, -camera.position.z/ndc.z);
}

function pick(cx, cy){
  if(!ready) return null;
  ndcPt.set(((cx - VX)/VW)*2-1, -((cy - VY)/VH)*2+1);
  raycaster.setFromCamera(ndcPt, camera);
  const hits = raycaster.intersectObject(matte, false);
  return hits.length ? hits[0] : null;
}

addEventListener('pointermove', e=>{
  pointerX = e.clientX; pointerY = e.clientY;
  target.copy(toWorld(e.clientX, e.clientY));
  mx = (e.clientX - cxMid())/(VW/2);
  my = (e.clientY - cyMid())/(VH/2);
  rGoal = 1;
  if(!touched) touched = true;
  if(coarse) return;
  if(fsOn()) return;      // the real cursor has the room; nothing to stand in for

  ret.classList.add('on');

  const ui = e.target.closest ? e.target.closest('[data-tag]') : null;
  const inPanel = e.target.closest ? e.target.closest('.panel,.lens') : null;
  const over = !ui && !inPanel && !!pick(e.clientX, e.clientY);

  if(over !== hoverForm){
    hoverForm = over;
    if(over){ blip(1500, 0.035); exploreIntro = false; }   // they've found it
  }
  refreshExplore();

  // the direction you lean picks the field
  if(exploreEl.classList.contains('on') && !ui && !stacked()){
    const a = Math.atan2(e.clientY - cyMid(), (e.clientX - cxMid()) * (VH/VW));
    let best = 0, bd = 9;
    chipAngle.forEach((ca,i)=>{
      let d = Math.abs(((a - ca + Math.PI*3) % (Math.PI*2)) - Math.PI);
      if(d < bd){ bd = d; best = i; }
    });
    setActive(best);
  }

  ret.classList.toggle('lock', !!ui || over);
  syncTag();
}, { passive:true });

addEventListener('pointerleave', ()=>{
  rGoal = 0; mx = 0; my = 0;
  ret.classList.remove('on');
  hoverForm = false; refreshExplore();
});

/* ── drag to turn the form, tap to change it ──────────────────────────────
   One gesture, two readings. Travel past a small threshold is a turn: sideways
   spins the form about its standing axis, up and down tips it, and letting go
   carries the momentum on. Anything under the threshold is a tap, which strikes
   the surface and starts the morph. Touch and mouse take the same path, so a
   phone gets the turn without the click having to be given up for it. */
const TAP_SLOP = coarse ? 14 : 6;        // px of travel still read as a tap
const TAP_MS = 700;
const SPIN_PER_PX = 0.0070;
const TILT_PER_PX = 0.0042;
let tilt = 0, tiltV = 0, grab = null;

// belt-and-braces: some mobile WebKit builds are inconsistent about treating
// a bare 'pointerdown' as the kind of user gesture that's allowed to unlock
// Web Audio, even though it fires and looks completely normal. 'touchstart'
// and 'mousedown' have always been on that allowlist everywhere, which is
// the real reason the nav buttons "worked" — their click handlers quietly
// caught what pointerdown missed. The 3D model had no such fallback, so a
// tap that only landed on canvas could silently fail to unlock on iOS.
addEventListener('touchstart', startAudio, { passive:true });
addEventListener('mousedown', startAudio);
addEventListener('click', startAudio);

addEventListener('pointerdown', e=>{
  // unlock audio on the very first touch contact anywhere on the page —
  // this must run before the UI exclusion below, which only exists to stop
  // taps on buttons/chips/panels from also spinning the 3D model. Without
  // this, tapping a floating chip (they carry [data-tag] too) never unlocked
  // audio, since it isn't part of the .hud button group either.
  startAudio();
  if(e.target.closest && (e.target.closest('[data-tag]') || e.target.closest('.panel,.lens'))) return;
  exploreIntro = false;
  grab = { id:e.pointerId, x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY,
           travel:0, t:performance.now(), turning:false, fx:0, fy:0 };
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  if(pick(e.clientX, e.clientY)){ hoverForm = true; refreshExplore(); }
});

addEventListener('pointermove', e=>{
  if(!grab || e.pointerId !== grab.id) return;
  const dx = e.clientX - grab.lx, dy = e.clientY - grab.ly;
  grab.lx = e.clientX; grab.ly = e.clientY;
  grab.travel += Math.abs(dx) + Math.abs(dy);
  if(grab.travel <= TAP_SLOP) return;            // still inside tap territory
  grab.turning = true;
  grab.fx = dx * SPIN_PER_PX;
  grab.fy = dy * TILT_PER_PX;
  spin += grab.fx;                               // the hand drives it directly,
  spinV = 0; tiltV = 0;                          // so any drift steps aside
  tilt = THREE.MathUtils.clamp(tilt + grab.fy, -0.9, 0.9);
  ret.classList.add('lock');
});

function letGo(e){
  if(!grab || (e && e.pointerId !== grab.id)) return;
  const g = grab; grab = null;
  try{ canvas.releasePointerCapture(g.id); }catch(err){}

  // a mouse leaving the glass takes the lens with it; a finger has no such
  // moment, so lifting it has to do the same job or the last touch stays lit
  if(coarse){ rGoal = 0; mx = 0; my = 0; }

  if(g.turning){                                 // a flick keeps turning after release
    spinV = THREE.MathUtils.clamp(g.fx * 0.85, -0.085, 0.085);
    tiltV = THREE.MathUtils.clamp(g.fy * 0.55, -0.05, 0.05);
    return;
  }
  if(performance.now() - g.t > TAP_MS) return;   // a long hold is not a tap

  const hit = pick(g.lx, g.ly);
  if(!hit){ refreshExplore(); return; }
  strikeAt(hit);
  startMorph(matte ? matte.worldToLocal(hit.point.clone()) : null);
  hoverForm = true;
  refreshExplore();
}
addEventListener('pointerup', letGo);
addEventListener('pointercancel', letGo);

// interface feedback
document.querySelectorAll('.hud a, .hud button').forEach(a=>{
  a.addEventListener('pointerenter', ()=>blip(1180, 0.03));
  // unlock on pointerdown, the earliest signal a touch gives us — by the time
  // a synthetic 'click' arrives on mobile, the browser's user-activation
  // window can already have lapsed, which is why the sound toggle used to
  // need a second tap to actually start audio.
  a.addEventListener('pointerdown', ()=>{
    startAudio();
    if(a.id !== 'sound') blip(880, 0.06);
  });
});

// the wheel turns the form about its own vertical axis, so you can walk around it
addEventListener('wheel', e=>{
  if(e.target.closest && e.target.closest('.panel,.lens')) return;
  spinV += e.deltaY * 0.00030;
  spinV = THREE.MathUtils.clamp(spinV, -0.075, 0.075);
}, { passive:true });

const soundBtn = document.getElementById('sound');
const soundLabel = document.getElementById('soundlabel');

function paintSound(){
  const live = started && soundOn;
  soundBtn.classList.toggle('live', live);

  const T = TH();

  themeIcon.textContent = mode === 'light' ? '◑' : '◐';

  keyLight.intensity = T.keyI;
  rimLight.intensity = T.rimI;
  ambLight.intensity = T.ambI;
  ambLight.color = new THREE.Color(T.ambC);
  uKeyC.value.set(T.key);

  if(field){
    field.material.opacity = T.fieldOp;
    const c = new THREE.Color(T.field);
    for(let i=0;i<blocks.length;i++) field.setColorAt(i, c);
    field.instanceColor.needsUpdate = true;
  }
  if(ready){
    matte.material.color.set(T.matte);
    matte.material.roughness = T.matteRough;
    matte.material.metalness = T.matteMetal;
    outline.material.color.set(T.line);
    outline.material.opacity = T.lineOp;
    wire.material.color.set(T.line);
    wireThru.material.color.set(T.line);
  }
  syncDust();
  drawPoster(VW, VH, DPR);
}

  applyTheme();
  blip(mode === 'light' ? 1560 : 1040, 0.05);
});

/* ══ layout ═══════════════════════════════════════════════════════════════ */
// everything measures the canvas itself. innerHeight lies on phones — the
// layout viewport runs behind the browser chrome — so the drawing buffer, the
// projection and the pointer maths are all pinned to the element's real box.
function chromeBands(){
  const hud = document.querySelector('.hud');
  const top = document.querySelector('.top');
  const bot = document.querySelector('.bot');
  const cs = hud ? getComputedStyle(hud) : null;
  const padT = cs ? (parseFloat(cs.paddingTop) || 0) : 24;
  const padB = cs ? (parseFloat(cs.paddingBottom) || 0) : 24;
  return {
    t: (top ? top.offsetHeight : 40) + padT,
    b: (bot ? bot.offsetHeight : 46) + padB + (stacked() ? 56 : 0)
  };
}

// the form is framed inside the space the interface leaves, not the whole screen
function fitView(){
  const r = canvas.getBoundingClientRect();
  VX = r.left; VY = r.top;
  VW = Math.max(1, Math.round(r.width));
  VH = Math.max(1, Math.round(r.height));

  const band = chromeBands();
  const freeH = Math.max(140, VH - band.t - band.b);
  const hFrac = stacked() ? 0.60 : 0.72;      // of the free band
  const wFrac = stacked() ? 0.74 : 0.60;      // of the full width
  const aspect = VW / VH;

  // the camera is framed against a fixed FIT×FIT reference box rather than
  // whichever shape is currently on screen, so swapping to a taller or wider
  // form never moves the camera itself — that would drag the background
  // field and everything else along with it. Only the form is rescaled, by
  // however much its own letterW/letterH fall short of the reference, so it
  // still lands on the same target fraction of the frame every time.
  visH = Math.max(FIT * VH / (freeH * hFrac), FIT / (wFrac * aspect), 3.4);
  camera.position.z = visH / (2*Math.tan(FOV*Math.PI/360));
  camera.aspect = aspect;
  camera.updateProjectionMatrix();

  const idealVisH = Math.max(letterH * VH / (freeH * hFrac), letterW / (wFrac * aspect), 3.4);
  formScaleGoal = visH / idealVisH;
  // the frame loop eases formScale toward this goal rather than snapping to
  // it here, so a model swap settles into its new size instead of popping.

  // put the form in the middle of the free band rather than the middle of the glass
  const centrePx = band.t + freeH/2;
  centreY = (VH/2 - centrePx) * (visH / VH);
}

function fitPoster(){
  const dist = camera.position.z - BACK_Z;
  const h = 2*Math.tan(FOV*Math.PI/360)*dist;
  poster.scale.set(h*camera.aspect, h, 1);
}

function resize(){
  fitView();
  renderer.setSize(VW, VH, false);
  fitPoster();
  sizeDust();
  drawPoster(VW, VH, DPR);
  placeChips();
  refreshExplore();
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize, 120));
if(window.visualViewport) visualViewport.addEventListener('resize', resize);
resize();
applyTheme();
// the bars change height once the webfont lands, so measure again
if(document.fonts && document.fonts.ready) document.fonts.ready.then(resize).catch(()=>{});
setTimeout(resize, 400);

/* ══ frame ════════════════════════════════════════════════════════════════ */
let first = true, last = performance.now(), fpsAcc = 0, fpsN = 0, bootP = 0;

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last)/1000 || 0.016);
  last = now;
  clock += 0.0068;

  if(bootP < 100){
    bootP += ((ready ? 100 : 88) - bootP) * (ready ? 0.16 : 0.05);
    bootfill.style.width = Math.min(100, bootP) + '%';
    bootpct.textContent = String(Math.round(Math.min(100, bootP))).padStart(2,'0');
    if(ready && bootP > 99.2 && first){
      first = false;
      bootmsg.textContent = 'READY';
      boot.classList.add('gone');
      setTimeout(()=>boot.remove(), 900);
    }
  }

  if(ready){
    intro = Math.min(1, intro + 0.009);
    const ease = 1 - Math.pow(1 - intro, 3);

    if(!touched || reduce){
      target.set(Math.sin(clock*1.1)*0.9, Math.cos(clock*0.72)*1.0, 0);
      rGoal = reduce ? 1 : 0.9;
    }

    radius += (rGoal - radius) * (rGoal < radius ? 0.14 : 0.055);   // quick to let go
    uC.value.lerp(target, touched ? 0.16 : 0.05);
    uR1.value = 0.62 * radius * ease;
    uR2.value = 1.02 * radius * ease;

    // wireframe reveal: mouse hover only — a touch device has no hover, so
    // coarse pointers never open the shell this way. An open panel is no
    // reason to withhold it: on a wide screen the form is still sitting there
    // beside the archive, and pointing at it should do what it always does.
    // On a narrow one the panel covers the form outright, and the hover test
    // already refuses anything inside .panel, so there is nothing to guard.
    const wantReveal = !coarse && !morph && hoverForm;
    reveal += ((wantReveal ? 1 : 0) - reveal) * (wantReveal ? 0.13 : 0.09);
    if(reveal < 0.002) reveal = 0;
    uReveal.value = reveal;
    // the hidden-line pass follows the reveal, a little under the front lines
    // so the near side of the mesh still reads as the near side
    wireThru.material.opacity = reveal * 0.42 * formFade;
    wireThru.visible = reveal > 0.01 && formFade > 0.02;

    // the turn about the local up axis, with weight — wheel, drag or flick
    spin += spinV;
    spinV *= reduce ? 0.7 : 0.945;
    if(Math.abs(spinV) < 0.00002) spinV = 0;

    // the tip from a vertical drag drifts back to level once the hand is off
    tilt += tiltV;
    tiltV *= reduce ? 0.7 : 0.9;
    if(Math.abs(tiltV) < 0.00002) tiltV = 0;
    if(!grab) tilt *= 0.992;
    tilt = THREE.MathUtils.clamp(tilt, -0.9, 0.9);

    // the form steps aside when the archive is open
    const gx = (panelOpen && VW > 900) ? -1.55 : 0;
    groupX += (gx - groupX) * 0.055;

    px += (mx - px)*0.04; py += (my - py)*0.04;
    group.rotation.y = spin + px*0.42 + Math.sin(clock*0.75)*0.13 + (1-ease)*0.8;
    group.rotation.x = -py*0.26 + Math.sin(clock*0.53)*0.08 + tilt;
    group.rotation.z = Math.sin(clock*0.41)*0.045;
    group.position.x = groupX;
    group.position.y = centreY + Math.sin(clock*1.15)*0.1;
    // the target size a swap asks for is reached gradually rather than in
    // one jump, so a much bigger or smaller form eases into place
    formScale += (formScaleGoal - formScale) * (reduce ? 0.18 : 0.09);

    group.scale.setScalar(formScale * (0.9 + 0.1*ease) * (panelOpen && VW > 900 ? 0.86 : 1));

    stepMorph(dt);
    applyFade(ease);

    let waveI = 0;
    if(wave){
      wave.t += dt;
      const k = wave.t / wave.life;
      if(k >= 1){
        wave = null; uPI.value = 0; uPR.value = 0;
      }else{
        const e2 = 1 - Math.pow(1 - k, 2.4);
        uPR.value = 0.02 + e2 * 3.6;
        uPI.value = Math.pow(1 - k, 1.7);
        waveI = uPI.value;
        waveWorld.copy(wave.local); group.localToWorld(waveWorld);
      }
    }
    if(strike.visible){
      strike.intensity *= Math.pow(0.02, dt);
      if(strike.intensity < 0.05){ strike.intensity = 0; strike.visible = false; }
    }

    updateField(ease, clock*8, waveWorld, uPR.value, waveI);
  }

  if(!coarse){
    retX += (pointerX - retX) * 0.42;
    retY += (pointerY - retY) * 0.42;
    ret.style.transform = 'translate(' + retX.toFixed(1) + 'px,' + retY.toFixed(1) + 'px) translate(-50%,-50%)';
  }

  renderer.render(scene, camera);

  fpsAcc += dt; fpsN++;
  if(fpsAcc >= 0.5){
    fpsOut.textContent = String(Math.round(fpsN / fpsAcc)).padStart(2,'0');
    fpsAcc = 0; fpsN = 0;
  }
}
requestAnimationFrame(frame);

/* ══ content ══════════════════════════════════════════════════════════════
   Reads content.json, which tools/build-content.mjs regenerates from the
   repository on every push. Adding a project folder, dropping a logo into
   clients/ or replacing about/cv.pdf is the whole workflow — this file
   never needs to change. */

/* the one arrow, pointed wherever it is needed: 'r' 'l' 'd' 'ur' */
const ico_ = dir =>
  '<svg class="ico ico-'+dir+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
    '<path d="M3.2 12h16.2"/><path d="M13.4 6l6 6-6 6"/></svg>';

/* [label, value, href, mark] — mark is a direction for ico_ */
const rows_ = list => list.map(([label, value, href, mark]) => {
  const inner = esc(label) + '<em>' + esc(value) + (mark ? ico_(mark) : '') + '</em>';
  return href
    ? '<a href="'+esc(href)+'"'+(/^https?:/i.test(href) ? ' target="_blank" rel="noopener"' : '') +
      ' data-tag="'+esc(label)+'">'+inner+'</a>'
    : '<span>'+inner+'</span>';
}).join('');

const block_ = (title, inner) =>
  '<div class="block"><b>'+esc(title)+'</b><div class="rows">'+inner+'</div></div>';

/* same block furniture, chips instead of rows */
const tagblock_ = (title, items) =>
  '<div class="block"><b>'+esc(title)+'</b><div class="taglist">' +
  items.map(s=>'<span>'+esc(s)+'</span>').join('') + '</div></div>';

/* about.skills is [{ label, items }] — one block per group */
const skills_ = groups => (groups || [])
  .filter(g => g && g.items && g.items.length)
  .map(g => tagblock_((g.label || 'SKILLS').toUpperCase(), g.items))
  .join('');

const elsewhere_ = links => {
  const entries = Object.entries(links || {});
  return entries.length
    ? block_('ELSEWHERE', rows_(entries.map(([k, v]) => [k.toUpperCase(), '', v, 'ur'])))
    : '';
};

/* Built from parts at runtime. The address is never present as a single
   string in the HTML or in content.json, so a scraper grepping the source
   for an address pattern comes away with nothing. */
function mailLink(email){
  if(!email || !email.user || !email.domain || !email.tld) return '';
  const at = String.fromCharCode(64);
  const addr = email.user + at + email.domain + '.' + email.tld;
  return '<a class="mail" href="#" data-mail="'+esc(addr)+'" data-tag="EMAIL" ' +
    'rel="nofollow noreferrer">' + esc(addr) + '</a>';
}

function buildPages(c){
  const site = c.site || {};
  const about = c.about || {};
  const clients = c.clients || {};
  const pages = {};

  /* ── ABOUT ── */
  const shot = about.portrait
    ? '<figure class="shot">' +
        '<img src="'+esc(about.portrait)+'" alt="'+esc(site.name || '')+'" loading="lazy" decoding="async">' +
        (about.caption ? '<i>'+esc(about.caption)+'</i>' : '') +
      '</figure>'
    : '';

  const paras = (about.paragraphs || []);
  const cv = about.cv;

  pages.ABOUT = {
    sub: (site.role || 'PROFILE').toUpperCase(),
    html: ()=>
      '<div class="who">' +
        (about.headline ? '<h3>'+esc(about.headline)+'</h3>' : '') +
        shot +
        '<div class="said">' + paras.map(p=>'<p>'+p+'</p>').join('') + '</div>' +
      '</div>' +
      skills_(about.skills) +
      (cv ? block_('DOCUMENTS', rows_([[
        'CURRICULUM VITAE',
        'PDF · ' + cv.size + ' · ' + cv.updated,
        cv.src + (cv.hash ? '?v=' + cv.hash : ''),
        'd'
      ]])) : '') +
      elsewhere_(site.links)
  };

  /* ── CLIENTS ── */
  const logos = clients.logos || [];
  const tiles = logos.length
    ? logos.map((l,i)=>'<div class="client">' +
        (l.src
          ? '<img src="'+esc(l.src)+'" alt="'+esc(l.name)+'" loading="lazy" decoding="async">'
          : mark(i)) +
        '<b>'+esc(String(l.name).toUpperCase())+'</b></div>').join('')
    : '';

  const engagements = clients.engagements || [];

  pages.CLIENTS = {
    sub: String(logos.length).padStart(2,'0') + ' ORGANISATIONS',
    html: ()=>
      (clients.lede ? '<p class="lede">'+esc(clients.lede)+'</p>' : '') +
      (tiles ? '<div class="clients">'+tiles+'</div>' : '') +
      (engagements.length
        ? block_('ENGAGEMENTS', rows_(engagements.map(e=>[e.name, e.year || ''])))
        : '') +
      (logos.length ? '' : '<p class="note">Drop a logo into clients/ and it appears here.</p>')
  };

  /* ── CONTACT ── */
  const details = Object.entries(site.details || {});

  pages.CONTACT = {
    sub: 'GET IN TOUCH',
    html: ()=>
      '<p class="lede">Open to commissions, collaborations and the occasional strange brief.</p>' +
      mailLink(site.email) +
      elsewhere_(site.links) +
      (details.length
        ? block_('DETAILS', rows_(details.map(([k,v])=>[k.toUpperCase(), v])))
        : '')
  };

  return pages;
}

/* the href stays inert in the markup; the real one is built on click */
document.addEventListener('click', e=>{
  const a = e.target.closest && e.target.closest('a[data-mail]');
  if(!a) return;
  e.preventDefault();
  location.href = 'mailto:' + a.dataset.mail;
});

const yearEl = document.getElementById('year');
if(yearEl) yearEl.textContent = String(new Date().getFullYear());

/* the model folder is inventoried by the same build step as everything else,
   so a new .glb needs no edit here. The fallback covers a folder served
   without the build script having run. */
function bootBench(c){
  const m = c && c.models;
  let list = [];
  if(Array.isArray(m)) list = m;
  else if(m && typeof m === 'object') list = m.alts || m.models || [];
  if(list.length){ setBench(list); return; }

  fetch(MODEL_DIR + 'models.json', { cache:'no-cache' })
    .then(r => r.ok ? r.json() : null)
    .then(j => { if(j) setBench(Array.isArray(j) ? j : (j.alts || j.models || [])); })
    .catch(()=>{});
}

function applyContent(c){
  bootBench(c);
  FIELDS = c.fields || [];
  PAGES = buildPages(c);

  const practice = document.getElementById('practice');
  if(FIELDS.length) practice.textContent = FIELDS.map(f=>f.key).join(' / ');

  buildChips();
  placeChips();
  refreshExplore();
  warmCovers();
}

fetch('content.json', { cache: 'no-cache' })
  .then(r=>{ if(!r.ok) throw new Error('content.json \u2192 HTTP ' + r.status); return r.json(); })
  .then(applyContent)
  .catch(err=>{
    console.error('[content]', err);
    bootBench(null);          // the forms are independent of the site index
    document.getElementById('practice').textContent = 'CONTENT UNAVAILABLE';
    PAGES = { ABOUT: { sub:'UNAVAILABLE', html:()=>
      '<p class="lede">The site index could not be loaded.</p>' +
      '<p class="note">content.json is generated by tools/build-content.mjs. ' +
      'Run <code>node tools/build-content.mjs</code>, then serve the folder over HTTP ' +
      '(<code>npx serve</code>) rather than opening the file directly.</p>' } };
  });
</script>
</body>
</html>
