    s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(44+r()*18)+'" fill="var(--ph0)"/>';
    s += '<path d="M'+(cx-230)+' '+cy+' h'+(460)+'" stroke="var(--ph2)" stroke-width="2"/>';
    s += '<rect x="'+(cx+120)+'" y="'+(cy-190)+'" width="86" height="86" fill="var(--ph2)"/>';
  }else if(kind === 1){                             // posters
    s += '<rect x="90" y="70" width="'+(W-180)+'" height="'+(H-140)+'" fill="none" stroke="var(--ph2)" stroke-width="2"/>';
    let y = 130;
    for(let i=0;i<6;i++){
      const w = 180 + r()*580;
      s += '<rect x="140" y="'+y+'" width="'+w+'" height="'+(i===0?46:18)+'" fill="'+(i===0?'var(--ph3)':'var(--ph2)')+'"/>';
      y += (i===0?90:44);
    }
    s += '<rect x="'+(W-320)+'" y="'+(H-250)+'" width="180" height="180" fill="var(--ph3)" opacity=".9"/>';
  }else if(kind === 2){                             // spatial — a solid, sited
    // the old 3d and xr placeholders, now one image: the frames and tracking
    // points put the form somewhere, which is the whole point of the merge
    for(let i=0;i<2;i++){
      const m = 110 + i*90;
      s += '<rect x="'+m+'" y="'+(m*0.62)+'" width="'+(W-m*2)+'" height="'+(H-m*1.24)+'" fill="none" stroke="var(--ph2)" stroke-width="'+(i===0?2:1)+'"/>';
    }
    for(let i=0;i<7;i++) s += '<circle cx="'+(160+r()*680)+'" cy="'+(120+r()*460)+'" r="'+(3+r()*5)+'" fill="var(--ph2)"/>';

    const cx = 500, cy = 350, k = 150 + r()*40;
    const p = (x,y)=> (cx + x) + ',' + (cy + y);
    s += '<polygon points="'+p(0,-k*1.15)+' '+p(k,-k*0.55)+' '+p(0,0)+' '+p(-k,-k*0.55)+'" fill="var(--ph3)" opacity=".92"/>';
    s += '<polygon points="'+p(-k,-k*0.55)+' '+p(0,0)+' '+p(0,k*1.15)+' '+p(-k,k*0.55)+'" fill="var(--ph2)"/>';
    s += '<polygon points="'+p(k,-k*0.55)+' '+p(0,0)+' '+p(0,k*1.15)+' '+p(k,k*0.55)+'" fill="var(--ph1)"/>';
    s += '<polygon points="'+p(0,-k*1.15)+' '+p(k,-k*0.55)+' '+p(k,k*0.55)+' '+p(0,k*1.15)+' '+p(-k,k*0.55)+' '+p(-k,-k*0.55)+'" fill="none" stroke="var(--ph2)" stroke-width="2"/>';

    // the innermost frame is a bracket, not a box: the form is being
    // registered against the space it sits in
    const bx = 290, by = 180, bw = W - bx*2, bh = H - by*2, t = 46;
    s += '<path d="M'+bx+' '+(by+t)+' v-'+t+' h'+t+' M'+(bx+bw-t)+' '+by+' h'+t+' v'+t
      + ' M'+(bx+bw)+' '+(by+bh-t)+' v'+t+' h-'+t+' M'+(bx+t)+' '+(by+bh)+' h-'+t+' v-'+t+'" '
      + 'fill="none" stroke="var(--ph3)" stroke-width="2"/>';
  }else{                                            // motion
    for(let i=0;i<7;i++){
      s += '<rect x="'+(110 + i*104)+'" y="'+(200 + Math.sin(i*0.9)*70)+'" width="72" height="'+(180 + i*22)+'" fill="var(--ph2)" opacity="'+(0.25 + i*0.11).toFixed(2)+'"/>';
    }
    for(let i=0;i<4;i++) s += '<rect x="90" y="'+(110 + i*140)+'" width="'+(300 + r()*520)+'" height="2" fill="var(--ph3)" opacity=".5"/>';
    s += '<rect x="'+(W-260)+'" y="'+(H-190)+'" width="150" height="90" fill="var(--ph3)"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice">'+s+'</svg>';
}


function mark(i){
  const r = seeded(i*7919 + 31);
  const p = [];
  const n = 2 + Math.floor(r()*3);
  for(let k=0;k<n;k++){
    const t = r();
    if(t < 0.34) p.push('<circle cx="'+(70+r()*160)+'" cy="'+100+'" r="'+(22+r()*30)+'" fill="none" stroke="var(--ph3)" stroke-width="7"/>');
    else if(t < 0.67) p.push('<rect x="'+(60+r()*150)+'" y="'+(58+r()*30)+'" width="'+(34+r()*54)+'" height="'+(34+r()*54)+'" fill="var(--ph3)"/>');
    else p.push('<path d="M'+(58+r()*60)+' 148 L'+(120+r()*50)+' 52 L'+(200+r()*40)+' 148 Z" fill="none" stroke="var(--ph3)" stroke-width="7"/>');
  }
  return '<svg viewBox="0 0 300 200"><rect width="300" height="200" fill="none"/>'+p.join('')+'</svg>';
}

let PAGES = {};

/* ══ explore chips ════════════════════════════════════════════════════════ */
const exploreEl = document.getElementById('explore');
let chips = [], chipAngle = [], active = 0;

function buildChips(){
  chips.forEach(c=>c.remove());
  chips = FIELDS.map((f,i)=>{
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.tag = f.key;
    b.innerHTML = '<i>'+String(i+1).padStart(2,'0')+'</i><span>'+f.key+'</span>';
    b.addEventListener('pointerenter', ()=>{ setActive(i); blip(1240, 0.03); });
    b.addEventListener('click', ()=>openField(i));
    exploreEl.appendChild(b);
    return b;
  });
  chipAngle = FIELDS.map((f,i)=> -Math.PI/2 + i*(Math.PI*2/FIELDS.length));
  active = 0;
  if(chips[0]) chips[0].classList.add('hot');
}

let chipRX = 1, chipRY = 1;
const stacked = ()=> innerWidth <= 720;

function placeChips(){
  if(stacked()){
    // the ring flattens into a strip parked above the bottom bar
    const bot = document.querySelector('.bot');
    const hud = document.querySelector('.hud');
    const pad = parseFloat(getComputedStyle(hud).paddingBottom) || 14;
    exploreEl.style.bottom = ((bot ? bot.offsetHeight : 60) + pad + 16) + 'px';
    chips.forEach(c=>{ c.style.left = ''; c.style.top = ''; c.classList.remove('hot'); });
    return;
  }
  exploreEl.style.bottom = '';
  chipRX = Math.min(VW*0.40, 400);
  chipRY = Math.min(VH*0.33, 265);
  chips.forEach((c,i)=>{
    c.style.left = (cxMid() + Math.cos(chipAngle[i])*chipRX) + 'px';
    c.style.top  = (cyMid() + Math.sin(chipAngle[i])*chipRY) + 'px';
    c.classList.toggle('hot', i === active);
  });
}

// anywhere inside the ring counts as still reaching for it, so the labels
// survive a slow drift from the form out to a label
function inReach(){
  const dx = (pointerX - cxMid()) / (chipRX * 1.34);
  const dy = (pointerY - cyMid()) / (chipRY * 1.34);
  return dx*dx + dy*dy <= 1;
}

function setActive(i){
  active = i;
  if(stacked()) return;
  chips.forEach((c,k)=>c.classList.toggle('hot', k === i));
}

/* The desktop learns the gesture from the reticle tag, which a touch screen
   never gets — there is no pointer to hang a word off. So on a coarse pointer
   the instruction is placed under the form itself: it waits for the shape to
   finish standing up, says the gesture once, and the first press on the clay
   retires it for the rest of the session. Nothing repeats it, because by then
   the hand has already done the thing it was asking for. */
const cue = document.getElementById('cue');
let cueDone = !coarse, cueLive = false, bootDone = false;

/* The same slot under the form, used twice. First it asks for the gesture —
   only where there is no reticle to hang the words off — and retires the
   moment the gesture happens. Then, once a form has actually stood up, it
   comes back once to say what the gesture was for. Two sentences, one element:
   they cannot collide, because the second cannot fire until after the press
   that dismissed the first. */
/* The break is written into it rather than left to the measure. Two clauses
   of almost the same length will otherwise wrap wherever the box happens to
   run out, which put it mid-clause; broken at the full stop the two lines
   balance and each one is a whole thought. The stylesheet holds it to those
   two lines on every width — see .cue.creed. */
const CREED_HOLD = 5400;         // long enough to read it through twice at a
                                 // glance, short enough that it is gone before
                                 // it starts being furniture
let creedState = 0;              // 0 not yet, 1 saying it, 2 said
let creedArmed = false;          // a hand cured it, and the form is still rising
let creedTimer = null;

function showCreed(){
  if(creedState || panelOpen || lensOpen()) return;
  creedState = 1;
  cue.textContent = WORDS.cue.creed;
  cue.classList.add('creed');
  syncCue();
  creedTimer = setTimeout(retireCreed, CREED_HOLD);
}

// it has been read, or the visitor has gone to the work, which is better than
// reading it — either way it does not come back
function retireCreed(){
  if(creedState !== 1) return;
  creedState = 2;
  clearTimeout(creedTimer);
  cue.classList.remove('on');
}

function syncCue(){
  if(cueDone && creedState !== 1) return;
  if(!cueDone && !cueLive){
    // The sentence belongs to the page, not to the loading screen. `ready` is
    // only the moment the form finished building, and the overlay stays up and
    // keeps counting for a good while after it — so waiting on `ready` put the
    // instruction on screen over the top of the loader often enough to read as
    // a bug, and the 1400ms that was meant to keep it clear was a guess at a
    // duration nobody controls. It waits for the overlay to start clearing
    // instead, then fades in on its own half-second against the boot's
    // six-tenths, which lands it with the rest of the interface rather than
    // trailing in behind it.
    if(!bootDone) return;
    cueLive = true;
  }
  cue.style.left = (VX + VW/2) + 'px';
  cue.style.top  = (VY + cueY) + 'px';
  cue.classList.toggle('on', !panelOpen && !lensOpen());
}

// the press landed, so the sentence has served its purpose
function dismissCue(){
  if(cueDone) return;
  cueDone = true;
  cue.classList.remove('on');
}

let hoverForm = false, hoverChips = false, exploreTimer = null;
// the work is the point of the place, so the wheel shows itself as soon as the
// form is standing and stays out until the visitor has reached for it once —
// after that it goes back to answering the pointer
let exploreIntro = true;
function refreshExplore(){
  syncCue();                 // the cue answers to the same moments the ring does
  clearTimeout(exploreTimer);
  if(panelOpen || !ready){ exploreEl.classList.remove('on'); return; }
  if(stacked()){ exploreEl.classList.add('on'); return; }   // always there on a phone
  if(exploreIntro){ exploreEl.classList.add('on'); return; }
  const open = exploreEl.classList.contains('on');
  if(hoverForm || hoverChips || (open && inReach())) exploreEl.classList.add('on');
  else exploreTimer = setTimeout(()=>{
    if(!panelOpen && !(hoverForm || hoverChips)) exploreEl.classList.remove('on');
  }, 420);
}
exploreEl.addEventListener('pointerenter', ()=>{ hoverChips = true; refreshExplore(); });
exploreEl.addEventListener('pointerleave', ()=>{ hoverChips = false; refreshExplore(); });

/* ══ work panel ═══════════════════════════════════════════════════════════ */
const panel = document.getElementById('panel');
const gridEl = document.getElementById('grid');
const gridView = document.getElementById('gridview');
const detailView = document.getElementById('detailview');
const pField = document.getElementById('panelfield');
const pSub = document.getElementById('panelsub');
const pPrev = document.getElementById('pprev');
const pNext = document.getElementById('pnext');
const pBack = document.getElementById('pback');
const pClose = document.getElementById('pclose');

let panelOpen = false, fieldIx = 0, workIx = -1;

function showPanel(){
  panelOpen = true;
  retireCreed();            // they have reached for the work; the sentence has been overtaken
  hoverChips = false; hoverForm = false;
  panel.classList.add('on');
  /* Marks the page while the panel is up, so the stylesheet can move the few
     bits of HUD the panel would otherwise sit on top of — currently just the
     centred rights line, which the panel cuts off mid-word. */
  document.body.classList.add('pan');
  panel.setAttribute('aria-hidden','false');
  refreshExplore();
  blip(920, 0.05);
}

function openPage(k){
  const p = PAGES[k];
  if(!p) return;
  fieldIx = -1; workIx = -1;
  panelState = { kind:'page', key:k };
  pField.textContent = WORDS.nav[k] || k;
  pSub.textContent = p.sub;
  haltMedia(gridEl);
  gridEl.className = 'page';
  gridEl.innerHTML = p.html();
  gridEl.querySelectorAll('a').forEach(a=>a.addEventListener('pointerenter', ()=>blip(1180, 0.026)));
  showGrid();
  showPanel();
}

/* `quiet` rebuilds the same grid without working the clay — what a language
   change needs, since the visitor did not reach for anything and the form
   behind the panel has no business changing shape because a word did. */
function openField(i, quiet){
  /* Reaching for a discipline works the clay too, so the mark behind the panel
     is never the one that was standing when the visitor arrived — but not in
     this frame. Building the grid below is the heaviest main-thread moment on
     the page, and handing the new target to the GPU in the same frame put the
     two costs on top of each other, which is what was felt as a stutter. */
  if(!quiet) requestAnimationFrame(()=>requestAnimationFrame(startMorph));
  fieldIx = i; workIx = -1;
  panelState = { kind:'field', i };
  const f = FIELDS[i];
  haltMedia(gridEl);
  gridEl.className = 'grid';
  pField.textContent = f.key;
  pSub.textContent = String(f.works.length).padStart(2,'0') + ' ' + WORDS.panel.works + ' — ' + f.sub;
  gridEl.innerHTML = '';
  f.works.forEach((w,k)=>{
    const c = document.createElement('button');
    c.type = 'button'; c.className = 'card'; c.dataset.tag = WORDS.tag.open;
    c.innerHTML = '<span class="thumb">'+workMedia(w, f, i*97 + k*13 + 5, true)+'</span>' +
      '<span class="meta"><b>'+esc(w.t)+'</b><span>'+esc(w.y || '')+'</span></span>';
    c.style.opacity = '0'; c.style.transform = 'translateY(16px)';
    /* the thumb is the cover file, so its ratio is free to learn here — and
       reaching for a card warms the rest of that folder ahead of the click */
    noteAR(c.querySelector('img'), w.img);
    c.addEventListener('pointerenter', ()=>{ blip(1180, 0.026); warmWork(w); });
    c.addEventListener('focus', ()=>warmWork(w));
    watchVideo(c.querySelector('video'));
    c.addEventListener('click', ()=>openWork(k));
    gridEl.appendChild(c);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      c.style.transitionDelay = (k*60) + 'ms';
      c.style.opacity = ''; c.style.transform = '';
    }));
  });
  showGrid();
  showPanel();
}

function showGrid(){
  haltMedia(detailView);
  workIx = -1;
  pBack.textContent = fieldIx < 0 ? WORDS.panel.top : WORDS.panel.index;
  gridView.classList.remove('hide');
  detailView.classList.add('hide');
  pPrev.hidden = pNext.hidden = pBack.hidden = true;
  gridView.scrollTop = 0;
}

const PLAY_ICON = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg>';

const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const calm = ()=> matchMedia('(prefers-reduced-motion:reduce)').matches;

/* A cover image if the folder has one, else a video, else procedural artwork. */
/* ── image ratios ─────────────────────────────────────
   A frame that knows the file's shape before it paints never jumps. Ratios
   are measured once per src, off-DOM, and cached — so by the time a project
   opens, its boxes are already the right shape. */
const AR = new Map();          // src -> "w/h"
const AR_WAIT = new Map();     // src -> promise, so a src is measured once

const arVar = src => AR.has(src) ? ' style="--media-ar:' + AR.get(src) + '"' : '';

/* Record a ratio from an <img> that is already on the page (a grid thumb, say)
   — the file is downloaded either way, so this costs nothing. */
function noteAR(img, src){
  if(!img || !src || AR.has(src)) return;
  const grab = ()=>{
    if(img.naturalWidth && img.naturalHeight)
      AR.set(src, img.naturalWidth + '/' + img.naturalHeight);
  };
  if(img.complete) grab(); else img.addEventListener('load', grab, { once:true });
}

function measureAR(src){
  if(!src) return Promise.resolve('');
  if(AR.has(src)) return Promise.resolve(AR.get(src));
  if(AR_WAIT.has(src)) return AR_WAIT.get(src);

  const p = new Promise(res=>{
    const im = new Image();
    im.decoding = 'async';
    const grab = ()=>{
      if(!im.naturalWidth || !im.naturalHeight) return false;
      const ar = im.naturalWidth + '/' + im.naturalHeight;
      AR.set(src, ar); res(ar); return true;
    };
    /* Dimensions sit in the file header, so they are readable long before the
       last byte lands — polling gets them frames earlier than `load` would. */
    const poll = ()=>{
      if(grab()) return;
      if(im.complete) res('');
      else requestAnimationFrame(poll);
    };
    im.onload  = ()=>{ if(!grab()) res(''); };
    im.onerror = ()=>res('');
    im.src = src;
    requestAnimationFrame(poll);
  });

  AR_WAIT.set(src, p);
  return p;
}

const warmAR = list => (list || []).filter(Boolean).forEach(measureAR);

/* Everything a project will show, warmed the moment the card is touched. */
const warmWork = w => { if(w) warmAR([w.img].concat(w.gallery || [])); };

/* Covers for the whole index, once the browser is otherwise idle. */
function warmCovers(){
  idle(()=>{
    const covers = [];
    FIELDS.forEach(f => (f.works || []).forEach(w => { if(w.img) covers.push(w.img); }));
    warmAR(covers);
  });
}

/* Give `frame` the ratio of `src`: instantly when it is known, otherwise as
   soon as the header arrives. `token` guards against a fast click-through
   landing an old measurement on the new project. */
function applyAR(frame, src, token){
  if(!src) return;
  if(AR.has(src)){ frame.style.setProperty('--media-ar', AR.get(src)); return; }
  frame.classList.add('ar-soft');       // let the correction ease in, not snap
  measureAR(src).then(ar=>{
    if(ar && frame.dataset.arToken === token) frame.style.setProperty('--media-ar', ar);
  });
}

/* Fade the picture in over its own frame instead of popping it into place. */
function revealOnLoad(img, frame){
  const done = ()=>{ img.classList.add('ready'); if(frame) frame.classList.remove('skel'); };
  if(img.complete && img.naturalWidth) done();
  else{
    img.addEventListener('load', done, { once:true });
    img.addEventListener('error', done, { once:true });
  }
}

function workMedia(w, f, seed, thumb){
  if(w.img){
    return '<img src="'+esc(w.img)+'" alt="'+esc(w.t)+'"' +
      (thumb ? ' loading="lazy"' : '') + ' decoding="async">';
  }
  if(w.video){
    return '<video src="'+esc(w.video)+'" muted loop playsinline preload="metadata"' +
      (calm() ? '' : ' autoplay') + (thumb ? '' : ' controls') + '></video>';
  }
  return art(f.kind, seed);
}
const chips_ = list => list.map(x=>'<span>'+x+'</span>').join('');

function workInfo(w){
  let h = '';
  if(w.b) h += '<div><b>'+(w.lb||WORDS.info.brief)+'</b><p>'+w.b+'</p></div>';
  if(w.a || w.credit){
    h += '<div><b>'+(w.la||WORDS.info.approach)+'</b>' +
      (w.a ? '<p>'+w.a+'</p>' : '') +
      (w.credit ? '<p>'+w.credit+'</p>' : '') +
    '</div>';
  }
  const clientList = (w.clients && w.clients.length) ? w.clients : (w.c ? [w.c] : []);
  if(clientList.length) h += '<div><b>'+(clientList.length > 1 ? WORDS.info.clients : WORDS.info.client)+
    '</b><div class="tags">'+chips_(clientList)+'</div></div>';
  if(w.roles)   h += '<div><b>'+WORDS.info.role+'</b><div class="tags">'+chips_(w.roles)+'</div></div>';

  const row =
    (w.y ? '<div><b>'+WORDS.info.year+'</b><p>'+esc(w.y)+'</p></div>' : '') +
    (!w.roles && w.r ? '<div><b>'+WORDS.info.role+'</b><p>'+esc(w.r)+'</p></div>' : '');
  if(row) h += '<div class="row">'+row+'</div>';

  return h;
}

function openWork(k){
  const f = FIELDS[fieldIx], w = f.works[k];
  workIx = k;
  panelState = { kind:'work', i:fieldIx, k };

  const media = workMedia(w, f, fieldIx*97 + k*13 + 5, false);
  const play = w.link
    ? '<a class="play" href="'+w.link+'" target="_blank" rel="noopener" data-tag="'+esc(WORDS.tag.play)+'">'+PLAY_ICON+esc(WORDS.watch)+'</a>'
    : '';
  const dimg = document.getElementById('detailimg');
  haltMedia(dimg);
  dimg.innerHTML = media + play;
  const pl = dimg.querySelector('.play');
  if(pl) pl.addEventListener('pointerenter', ()=>blip(1320, 0.03));

  /* Video projects size their frame to the footage, not to the still-image
     box, so 16:9 motion work is shown whole. */
  const vid = dimg.querySelector('video');
  dimg.classList.toggle('is-video', !!vid);
  dimg.style.removeProperty('--media-ar');
  if(vid){
    const fitFrame = ()=>{
      if(vid.videoWidth && vid.videoHeight){
        dimg.style.setProperty('--media-ar', vid.videoWidth + '/' + vid.videoHeight);
      }
    };
    vid.addEventListener('loadedmetadata', fitFrame);
    fitFrame();
  }

  /* Stills do the same: the cover keeps its own ratio, portrait or landscape.
     The ratio is usually already cached from the grid thumb, so the frame is
     the right shape on its first paint. */
  const cover = dimg.querySelector('img');
  dimg.classList.remove('ar-soft', 'skel');
  dimg.classList.toggle('is-img', !!cover);
  dimg.dataset.arToken = String(fieldIx) + ':' + String(k);
  if(cover){
    applyAR(dimg, w.img, dimg.dataset.arToken);
    dimg.classList.add('skel');
    revealOnLoad(cover, dimg);
  }

  watchVideo(vid);

  /* the cover leads, then everything else in the folder */
  const shots = (w.img ? [w.img] : []).concat(w.gallery || []);

  const hero = w.img ? dimg.querySelector('img') : null;
  if(hero && shots.length){
    const open = ()=>openLens(shots, 0, w.t);
    hero.dataset.tag = WORDS.tag.view;
    hero.setAttribute('role', 'button');
    hero.setAttribute('tabindex', '0');
    hero.addEventListener('click', open);
    hero.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
    });
  }

  document.getElementById('detailtitle').textContent = w.t;
  document.getElementById('detailtag').textContent = w.tag
    || (f.key + ' / ' + w.y + ' / ' + String(k+1).padStart(2,'0') + ' ' + WORDS.panel.of + ' ' + String(f.works.length).padStart(2,'0'));
  document.getElementById('detailinfo').innerHTML = workInfo(w);

  const gal = document.getElementById('detailgal');
  const rest = w.gallery || [];
  const offset = w.img ? 1 : 0;
  gal.hidden = rest.length === 0;
  /* A cached ratio is written straight into the markup, so the tile is born
     the right shape — nothing to correct afterwards. */
  gal.innerHTML = rest.map((src,n)=>
    '<button class="gshot skel" type="button" data-tag="'+esc(WORDS.tag.view)+'"'+arVar(src)+
      ' aria-label="'+esc(WORDS.aria.image)+' '+(n+1+offset)+'">' +
      '<img src="'+esc(src)+'" alt="'+esc(w.t)+' \u2014 '+(n+1+offset)+'" decoding="async">' +
    '</button>'
  ).join('');
  gal.querySelectorAll('button').forEach((btn,n)=>{
    const src = rest[n], im = btn.querySelector('img');
    btn.dataset.arToken = dimg.dataset.arToken + ':' + n;
    applyAR(btn, src, btn.dataset.arToken);
    revealOnLoad(im, btn);
    noteAR(im, src);
    btn.addEventListener('pointerenter', ()=>blip(1180, 0.026));
    btn.addEventListener('click', ()=>openLens(shots, n + offset, w.t));
  });

  /* PREV / NEXT should land as cleanly as the first open */
  warmWork(f.works[(k + 1) % f.works.length]);
  warmWork(f.works[(k - 1 + f.works.length) % f.works.length]);

  gridView.classList.add('hide');
  detailView.classList.remove('hide');
  detailView.scrollTop = 0;
  pBack.hidden = false;
  pPrev.hidden = pNext.hidden = f.works.length < 2;
  blip(1420, 0.045);
}

function stepWork(d){
  const n = FIELDS[fieldIx].works.length;
  openWork((workIx + d + n) % n);
}

function closePanel(){
  panelOpen = false;
  unpinForm();
  panel.classList.remove('on');
  document.body.classList.remove('pan');
  panel.setAttribute('aria-hidden','true');
  haltMedia(panel);
  showGrid();
  /* Coming back out of a panel is the same situation as arriving: the pointer
     is parked on a close button that is no longer there, so the stale hover
     flags say the pointer is nowhere near the form and the ring would stay
     hidden until the visitor happened to sweep back over the clay. Re-arming
     the intro puts the wheel back out and leaves it out until they reach for
     it again, which is what it does on first load. */
  exploreIntro = true;
  hoverChips = false; hoverForm = false;
  refreshExplore();          // without this the chip strip stays hidden on touch
  blip(640, 0.045);
}

pPrev.addEventListener('click', ()=>stepWork(-1));
pNext.addEventListener('click', ()=>stepWork(1));
pBack.addEventListener('click', ()=>{ showGrid(); blip(880,0.04); });
pClose.addEventListener('click', closePanel);
document.querySelectorAll('.menu [data-page]').forEach(b=>
  b.addEventListener('click', ()=>{ startAudio(); openPage(b.dataset.page); }));
/* ══ lightbox ═════════════════════════════════════════════════════════════
   Tapping any project image lifts it out of the panel: the backdrop dims,
   the image scales up, and arrows or a swipe move through the rest of the
   folder. */
const lens = document.getElementById('lens');
const lensBg = document.getElementById('lensbg');
const lensImg = document.getElementById('lensimg');
const lensClose = document.getElementById('lensclose');
const lensPrev = document.getElementById('lensprev');
const lensNext = document.getElementById('lensnext');
const lensCount = document.getElementById('lenscount');
const lensNow = document.getElementById('lensnow');
const lensTotal = document.getElementById('lenstotal');

let lensSet = [], lensIx = 0, lensName = '', lensSwap = null;
const lensOpen = ()=> !lens.hidden;

function paintLens(){
  const many = lensSet.length > 1;
  lensPrev.hidden = lensNext.hidden = lensCount.hidden = !many;
  lensNow.textContent = String(lensIx + 1).padStart(2,'0');
  lensTotal.textContent = String(lensSet.length).padStart(2,'0');
}

function showShot(){
  lensImg.src = lensSet[lensIx];
  lensImg.alt = lensName + ' \u2014 ' + (lensIx + 1) + ' ' + WORDS.panel.of + ' ' + lensSet.length;
}

function openLens(set, i, name){
  if(!set || !set.length) return;
  zClear();                           // a new picture always opens squared up
  lensSet = set;
  lensIx = Math.max(0, Math.min(i | 0, set.length - 1));
  lensName = name || '';
  lens.hidden = false;
  showShot();
  paintLens();
  // one frame on screen before the transition, or it has nothing to run from
  requestAnimationFrame(()=>requestAnimationFrame(()=>lens.classList.add('on')));
  lensClose.focus({ preventScroll:true });
  blip(1380, 0.04);
}

function stepLens(d){
  if(lensSet.length < 2) return;
  lensIx = (lensIx + d + lensSet.length) % lensSet.length;
  zReset(true);                       // the one you were reading squares up as it goes
  paintLens();
  clearTimeout(lensSwap);
  lensImg.classList.add('swap');
  lensSwap = setTimeout(()=>{ showShot(); lensImg.classList.remove('swap'); }, 150);
  blip(1180, 0.03);
}

function closeLens(){
  if(!lensOpen()) return;
  zReset(true);
  lens.classList.remove('on');
  clearTimeout(lensSwap);
  setTimeout(()=>{
    lens.hidden = true;
    lensImg.removeAttribute('src');   // never leave a broken frame behind
    lensImg.classList.remove('swap');
  }, 320);
  blip(720, 0.04);
}

lensClose.addEventListener('click', closeLens);
lensPrev.addEventListener('click', ()=>stepLens(-1));
lensNext.addEventListener('click', ()=>stepLens(1));
[lensClose, lensPrev, lensNext].forEach(b=>
  b.addEventListener('pointerenter', ()=>blip(1240, 0.03)));

/* the wheel steps through the set, one image per gesture rather than per tick */
let lensWheel = 0;
lens.addEventListener('wheel', e=>{
  if(!lensOpen()) return;
  e.preventDefault();
  const now = performance.now();
  if(now - lensWheel < 260) return;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if(Math.abs(d) < 4) return;
  lensWheel = now;
  stepLens(d > 0 ? 1 : -1);
}, { passive:false });

/* ── pinch to zoom, swipe to move, tap to dismiss ────────────────────────
   Three readings of one surface, and they must never overlap. Two fingers
   push the photo in, scaling it about the point held between them; once it
   is larger than the screen a single finger moves it around; at rest a
   sideways flick steps the folder and a tap on the backdrop closes.

   The zoom is run here rather than handed to the browser's own pinch, which
   would scale the entire overlay — chrome, backdrop, counter and all — and
   leave the visitor stranded at 3x with no way to square it up again. This
   way only the photograph moves, and letting go always leaves the interface
   where it was. */
const lensStage = document.querySelector('.lens-stage');
const ZMAX = 4;                                  // far enough in to read grain
let zS = 1, zX = 0, zY = 0;                      // scale, and offset in px
const zPts = new Map();                          // every finger on the sheet
let zGest = null, lensSwipe = null;

const zoomed = ()=> zS > 1.01;

function zApply(ease){
  lensStage.classList.toggle('live', !ease);     // no easing under the fingers
  lensStage.classList.toggle('zoom', zoomed());
  lensImg.style.transform = (zS === 1 && !zX && !zY)
    ? ''                                         // hand the frame back to the CSS
    : 'translate3d(' + zX + 'px,' + zY + 'px,0) scale(' + zS + ')';
}

// the photo may be moved only as far as its own edges — never past them
function zClamp(){
  const mx = Math.max(0, (lensImg.clientWidth  * zS - innerWidth)  / 2);
  const my = Math.max(0, (lensImg.clientHeight * zS - innerHeight) / 2);
  zX = Math.max(-mx, Math.min(mx, zX));
  zY = Math.max(-my, Math.min(my, zY));
}

let zSettle = null;

// straight back to fit with no animation and no leftover state — for opening,
// where the lift-in needs the stylesheet's own transition left alone
function zClear(){
  clearTimeout(zSettle);
  zS = 1; zX = 0; zY = 0; zGest = null;
  zPts.clear(); lensSwipe = null;
  lensStage.classList.remove('live', 'zoom');
  lensImg.style.transform = '';
}

function zReset(ease){
  const was = zoomed();
  clearTimeout(zSettle);
  zS = 1; zX = 0; zY = 0; zGest = null;
  if(ease !== false && was){
    // hold the quick curve until the photo has actually landed back on fit,
    // then let go of it so the open and swap animations get their own timing
    lensStage.classList.remove('live');
    lensStage.classList.add('zoom');
    lensImg.style.transform = '';
    zSettle = setTimeout(()=>lensStage.classList.remove('zoom'), 340);
    return;
  }
  zApply(ease !== false);
}

lens.addEventListener('pointerdown', e=>{
  if(e.target.closest('.lens-btn')) return;      // let the buttons be buttons
  zPts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  // fingers are captured so a gesture that wanders off the photo keeps
  // reporting; a mouse is left alone, so the desktop path is untouched
  if(e.pointerType !== 'mouse'){ try{ lens.setPointerCapture(e.pointerId); }catch(err){} }

  if(zPts.size === 2){                           // a second finger is a pinch,
    lensSwipe = null;                            // and never a swipe or a tap
    const [a, b] = [...zPts.values()];
    zGest = { kind:'pinch', s0:zS, x0:zX, y0:zY,
              d0:Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
              mx:(a.x + b.x)/2, my:(a.y + b.y)/2 };
    return;
  }
  if(zPts.size > 2){ zGest = null; lensSwipe = null; return; }

  zGest = zoomed() ? { kind:'pan', px:e.clientX, py:e.clientY, x0:zX, y0:zY } : null;
  lensSwipe = { x:e.clientX, y:e.clientY, moved:false, on:e.target };
});

lens.addEventListener('pointermove', e=>{
  const p = zPts.get(e.pointerId);
  if(p){ p.x = e.clientX; p.y = e.clientY; }
  if(lensSwipe && Math.abs(e.clientX - lensSwipe.x) > 10) lensSwipe.moved = true;
  if(!zGest) return;

  if(zGest.kind === 'pinch' && zPts.size >= 2){
    const [a, b] = [...zPts.values()];
    const d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
    const s = Math.max(1, Math.min(ZMAX, zGest.s0 * (d / zGest.d0)));
    // the point between the fingers is the anchor: work out where it sits on
    // the photograph itself, then place the photograph so it stays under them
    const cx = innerWidth/2, cy = innerHeight/2;
    const ux = (zGest.mx - cx - zGest.x0) / zGest.s0;
    const uy = (zGest.my - cy - zGest.y0) / zGest.s0;
    zS = s;
    zX = (a.x + b.x)/2 - cx - s*ux;
    zY = (a.y + b.y)/2 - cy - s*uy;
    zClamp(); zApply(false);
    return;
  }
  if(zGest.kind === 'pan'){
    zX = zGest.x0 + (e.clientX - zGest.px);
    zY = zGest.y0 + (e.clientY - zGest.py);
    zClamp(); zApply(false);
  }
}, { passive:true });

function lensLetGo(e){
  const many = zPts.size > 1;
  zPts.delete(e.pointerId);
  try{ if(lens.hasPointerCapture(e.pointerId)) lens.releasePointerCapture(e.pointerId); }catch(err){}

  if(many){                                      // coming out of a pinch
    zGest = null; lensSwipe = null;
    if(zS <= 1.02) zReset(true); else { zClamp(); zApply(true); }
    // a finger still down carries straight on into a move, from where it is,
    // so the photo doesn't jump the moment the other one lifts
    if(zPts.size === 1 && zoomed()){
      const [q] = [...zPts.values()];
      zGest = { kind:'pan', px:q.x, py:q.y, x0:zX, y0:zY };
    }
    return;
  }

  const sw = lensSwipe;
  zGest = null; lensSwipe = null;
  if(!sw || e.type === 'pointercancel'){ if(zoomed()){ zClamp(); zApply(true); } return; }

  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  const tap = !sw.moved && Math.abs(dx) < 10 && Math.abs(dy) < 10;

  // while the photo is in close, everything answers to the zoom: a tap squares
  // it back up rather than closing, so no one can be stranded at 4x, and a
  // drag has already moved it and wants no second reading
  if(zoomed()){
    if(tap) zReset(true); else { zClamp(); zApply(true); }
    return;
  }
  // horizontal intent only, so a vertical flick doesn't jump the image
  if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ stepLens(dx < 0 ? 1 : -1); return; }
  if(tap && (sw.on === lensBg || sw.on === lens)) closeLens();
}
lens.addEventListener('pointerup', lensLetGo);
lens.addEventListener('pointercancel', lensLetGo);

/* Safari on iOS will happily run its own page zoom on top of this one, which
   would scale the whole overlay and leave no way back. These are WebKit's own
   gesture events, and they are only ever headed off over the lightbox — the
   rest of the page can still be pinched by anyone who needs to read it. */
['gesturestart','gesturechange','gestureend'].forEach(t=>
  lens.addEventListener(t, e=>{ if(lensOpen()) e.preventDefault(); }, { passive:false }));
lens.addEventListener('touchmove', e=>{
  if(lensOpen() && e.touches.length > 1) e.preventDefault();
}, { passive:false });

// a turned phone changes what "as far as its own edges" means
addEventListener('resize', ()=>{ if(lensOpen() && zoomed()){ zClamp(); zApply(true); } });

/* ══ the photographs are not for taking ═══════════════════════════════════
   Right-click on the desktop and the press-and-hold callout on a phone both
   go nowhere over an image or over the lightbox — no "save image", no drag
   to the desktop, no selection. Worth being straight about what this is: a
   lock on the front door. The browser still has to fetch the files to draw
   them, so anyone who knows their way around devtools or the network tab can
   still get at them. What it does stop is the casual, thoughtless save, and
   that is nearly all of it. */
document.addEventListener('contextmenu', e=>{
  const t = e.target;
  if(t.closest && (t.closest('img') || t.closest('.lens') || t.closest('.thumb,.shot,.gal,.client')))
    e.preventDefault();
}, { capture:true });

document.addEventListener('dragstart', e=>{
  if(e.target && e.target.tagName === 'IMG') e.preventDefault();
});

addEventListener('keydown', e=>{
  if(lensOpen()){                       // the lightbox is on top, so it answers first
    if(e.key === 'Escape'){ closeLens(); return; }
    if(e.key === 'ArrowRight'){ stepLens(1); return; }
    if(e.key === 'ArrowLeft'){ stepLens(-1); return; }
    return;
  }
  if(e.key === 'Escape' && panelOpen){ workIx >= 0 ? showGrid() : closePanel(); }
  if(panelOpen && workIx >= 0){
    if(e.key === 'ArrowRight') stepWork(1);
    if(e.key === 'ArrowLeft')  stepWork(-1);
  }
});

/* ══ pointer, reticle, interface ══════════════════════════════════════════ */
const ret = document.getElementById('ret');
const retTag = document.getElementById('rettag');
const fpsOut = document.getElementById('fps');

/* Fullscreen is the one state where the site's own cursor cannot follow: the
   video is painted over the whole page, reticle included. The CSS hands the
   real pointer back; this puts the reticle away while it is gone, so nothing
   is chasing a cursor nobody can see, and returns it on the way out. The
   body flag exists because the fullscreen pseudo-classes are inconsistently
   applied to media elements across engines — the class is not. */
const fsOn = ()=> !!(document.fullscreenElement || document.webkitFullscreenElement);
let retWasOn = false;

function syncFullscreen(){
  const on = fsOn();
  document.body.classList.toggle('fs', on);
  if(on){
    retWasOn = ret.classList.contains('on');
    ret.classList.remove('on');
  }else if(retWasOn){
    retWasOn = false;
    ret.classList.add('on');
  }
}
document.addEventListener('fullscreenchange', syncFullscreen);
document.addEventListener('webkitfullscreenchange', syncFullscreen);

const raycaster = new THREE.Raycaster();
const ndcPt = new THREE.Vector2();
const target = new THREE.Vector3();
let reveal = 0;   // how open the wireframe reveal is — mouse hover only, never touch
const ndc = new THREE.Vector3();
let mx=0, my=0, px=0, py=0, touched=false, clock=0, intro=0, radius=0, rGoal=0;
let pointerX = innerWidth/2, pointerY = innerHeight/2, retX = pointerX, retY = pointerY;
let VX = 0, VY = 0, VW = innerWidth, VH = innerHeight, visH = 4.5, centreY = 0, formScale = 1, formScaleGoal = 1, cueY = 0;
// the goo is fitted to the same box whatever shape it is holding, so these
// no longer move — they are kept because fitView still frames against them
let letterW = SHAPE_R*2, letterH = SHAPE_R*2;
const cxMid = ()=> VX + VW/2;
const cyMid = ()=> VY + VH/2;
let spin = 0, spinV = 0, groupX = 0;

/* The reticle teaches the gesture once and then stops explaining itself. Press
   and hold is not a thing a visitor guesses at, so the first approach says so
   outright; from the moment they have done it once the tag stops instructing
   and starts naming the act instead, a different verb each time the clay is
   worked. Same word under the pointer as the one the press is about to carry
   out — it is a label, not a caption.

   The three forms of each verb are in the language table at the top of the
   file; what is held here is only which verb, by index. So a language change
   mid-gesture swaps the word the tag is showing without disturbing the draw
   — the bag has no idea a language exists. */
let verbIx = -1;
const verbBag = [];

const verbForms = () => WORDS.verbs[verbIx] || null;

// the verbs are drawn the same way as the shapes, and for the same reason —
// so the tag is not a list being read out in order, and so no press ever
// repeats the word the one before it used
function stepVerb(){
  verbIx = bagDraw(verbBag, WORDS.verbs.length, verbIx);
  syncTag();
}

function syncTag(){
  if(!hoverForm){ retTag.textContent = ''; return; }
  const v = verbForms();
  retTag.textContent = v ? v[0] : WORDS.cue.hold;
}

function toWorld(cx, cy){
  ndc.set(((cx - VX)/VW)*2-1, -((cy - VY)/VH)*2+1, 0.5).unproject(camera);
  ndc.sub(camera.position).normalize();
  return camera.position.clone().addScaledVector(ndc, -camera.position.z/ndc.z);
}

function pick(cx, cy){
  if(!ready) return null;
  ndcPt.set(((cx - VX)/VW)*2-1, -((cy - VY)/VH)*2+1);
  raycaster.setFromCamera(ndcPt, camera);
  const hits = raycaster.intersectObject(matte, false);
  return hits.length ? hits[0] : null;
}

addEventListener('pointermove', e=>{
  pointerX = e.clientX; pointerY = e.clientY;
  target.copy(toWorld(e.clientX, e.clientY));
  mx = (e.clientX - cxMid())/(VW/2);
  my = (e.clientY - cyMid())/(VH/2);
  rGoal = 1;
  if(!touched) touched = true;
  if(coarse) return;
  if(fsOn()) return;      // the real cursor has the room; nothing to stand in for

  ret.classList.add('on');

  const ui = e.target.closest ? e.target.closest('[data-tag]') : null;
  const inPanel = e.target.closest ? e.target.closest('.panel,.lens') : null;
  const over = !ui && !inPanel && !!pick(e.clientX, e.clientY);

  if(over !== hoverForm){
    hoverForm = over;
    if(over){ blip(1500, 0.035); exploreIntro = false; }   // they've found it
  }
  refreshExplore();

  // the direction you lean picks the field
  if(exploreEl.classList.contains('on') && !ui && !stacked()){
    const a = Math.atan2(e.clientY - cyMid(), (e.clientX - cxMid()) * (VH/VW));
    let best = 0, bd = 9;
    chipAngle.forEach((ca,i)=>{
      let d = Math.abs(((a - ca + Math.PI*3) % (Math.PI*2)) - Math.PI);
      if(d < bd){ bd = d; best = i; }
    });
    setActive(best);
  }

  ret.classList.toggle('lock', !!ui || over);
  syncTag();
}, { passive:true });

addEventListener('pointerleave', ()=>{
  rGoal = 0; mx = 0; my = 0;
  ret.classList.remove('on');
  hoverForm = false; refreshExplore();
});

/* ── press to shape it, drag to turn it ───────────────────────────────────
   One gesture doing both, which is what makes the clay feel like clay: the
   moment a hand lands on the goo it starts setting, and it goes on setting
   whether or not the hand then moves. Travel past a small threshold turns the
   form as well — sideways spins it about its standing axis, up and down tips
   it, and letting go carries the momentum on — so a shape can be held and
   walked around in the same motion. Lifting off is what releases it. Touch and
   mouse take the same path, so a phone gets both without either being given up. */
const SPIN_PER_PX = 0.0070;
const TILT_PER_PX = 0.0042;
let tilt = 0, tiltV = 0, grab = null;

// belt-and-braces: some mobile WebKit builds are inconsistent about treating
// a bare 'pointerdown' as the kind of user gesture that's allowed to unlock
// Web Audio, even though it fires and looks completely normal. 'touchstart'
// and 'mousedown' have always been on that allowlist everywhere, which is
// the real reason the nav buttons "worked" — their click handlers quietly
// caught what pointerdown missed. The 3D model had no such fallback, so a
// tap that only landed on canvas could silently fail to unlock on iOS.
addEventListener('touchstart', startAudio, { passive:true });
addEventListener('mousedown', startAudio);
addEventListener('click', startAudio);
// and again when the hand comes off. This is the press-and-hold case: if the
// unlock does not take at touchstart — which on older iOS is common enough to
// plan for — the only thing still trying is the watch below, and a hold that
// outlasts it ends in silence with no gesture left to retry on. The release is
// a fresh user activation and the last one this gesture will produce, so it
// gets its own attempt. Both are no-ops once audio is actually running.
addEventListener('touchend', startAudio, { passive:true });
addEventListener('pointerup', startAudio);
// and all the way through the hold in between. A finger resting on the clay is
// never perfectly still, so touchmove fires steadily for the whole gesture and
// costs nothing once audio is running — it gives the unlock a live retry at the
// exact moments the browser is most willing to grant one, instead of leaving
// the poll to guess.
addEventListener('touchmove', startAudio, { passive:true });

addEventListener('pointerdown', e=>{
  // unlock audio on the very first touch contact anywhere on the page —
  // this must run before the UI exclusion below, which only exists to stop
  // taps on buttons/chips/panels from also spinning the 3D model. Without
  // this, tapping a floating chip (they carry [data-tag] too) never unlocked
  // audio, since it isn't part of the .hud button group either.
  startAudio();
  if(e.target.closest && (e.target.closest('[data-tag]') || e.target.closest('.panel,.lens'))) return;
  exploreIntro = false;
  grab = { id:e.pointerId, x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY,
           travel:0, t:performance.now(), turning:false, fx:0, fy:0, onForm:false };
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}

  // landing on the goo is the whole gesture — it begins setting here and goes
  // on setting until the hand comes off, however much it moves in between
  const hit = pick(e.clientX, e.clientY);
  if(hit){
    grab.onForm = true;
    hoverForm = true;
    dismissCue();
    strikeAt(hit);
    startForm(true);
    syncTag();
    refreshExplore();
  }
});

addEventListener('pointermove', e=>{
  if(!grab || e.pointerId !== grab.id) return;
  const dx = e.clientX - grab.lx, dy = e.clientY - grab.ly;
  grab.lx = e.clientX; grab.ly = e.clientY;
  grab.travel += Math.abs(dx) + Math.abs(dy);
  if(grab.travel <= 4) return;                   // a hand resting still is not a turn
  grab.turning = true;
  grab.fx = dx * SPIN_PER_PX;
  grab.fy = dy * TILT_PER_PX;
  spin += grab.fx;                               // the hand drives it directly,
  spinV = 0; tiltV = 0;                          // so any drift steps aside
  tilt = THREE.MathUtils.clamp(tilt + grab.fy, -0.9, 0.9);
  ret.classList.add('lock');
});

function letGo(e){
  if(!grab || (e && e.pointerId !== grab.id)) return;
  const g = grab; grab = null;
  try{ canvas.releasePointerCapture(g.id); }catch(err){}

  // a mouse leaving the glass takes the lens with it; a finger has no such
  // moment, so lifting it has to do the same job or the last touch stays lit
  if(coarse){ rGoal = 0; mx = 0; my = 0; }

  // lifting off is what lets the clay go; the shape slumps from wherever it
  // had got to, and MIN_HOLD keeps a quick tap from being over unseen
  if(g.onForm) endForm();

  if(g.turning){                                 // a flick keeps turning after release
    spinV = THREE.MathUtils.clamp(g.fx * 0.85, -0.085, 0.085);
    tiltV = THREE.MathUtils.clamp(g.fy * 0.55, -0.05, 0.05);
  }
  refreshExplore();
}
addEventListener('pointerup', letGo);
addEventListener('pointercancel', letGo);

// interface feedback
document.querySelectorAll('.hud a, .hud button').forEach(a=>{
  a.addEventListener('pointerenter', ()=>blip(1180, 0.03));
  // unlock on pointerdown, the earliest signal a touch gives us — by the time
  // a synthetic 'click' arrives on mobile, the browser's user-activation
  // window can already have lapsed, which is why the sound toggle used to
  // need a second tap to actually start audio.
  a.addEventListener('pointerdown', ()=>{
    startAudio();
    if(a.id !== 'sound') blip(880, 0.06);
  });
});

// the wheel turns the form about its own vertical axis, so you can walk around it
addEventListener('wheel', e=>{
  if(e.target.closest && e.target.closest('.panel,.lens')) return;
  spinV += e.deltaY * 0.00030;
  spinV = THREE.MathUtils.clamp(spinV, -0.075, 0.075);
}, { passive:true });

const soundBtn = document.getElementById('sound');
const soundLabel = document.getElementById('soundlabel');

function paintSound(){
  const live = started && soundOn;
  soundBtn.classList.toggle('live', live);
  soundLabel.textContent = !started ? WORDS.tools.standby : (soundOn ? WORDS.tools.on : WORDS.tools.off);
  soundBtn.setAttribute('aria-checked', String(live));
}

/* ── the row must not move under a press ──────────────────────────────────
   .tools takes its width from its contents and sits against the right edge,
   so a control that changes width drags its neighbours sideways by 36px on a
   desktop. The language buttons are 33px wide, so that is a lost click. On a
   phone the row is full-width with the audio toggle held against the right
   edge by a margin, which means it grows into empty space and moves nobody —
   but the desktop case is enough on its own to need what follows.

   Normally that costs nothing, because a width only ever changes as the
   *result* of a click. The audio label is the one exception. The first
   pointerdown anywhere on the page unlocks the audio, and this label goes
   from its longest state to its shortest while the button is still held
   down — so the control being pressed slid out from under the cursor before
   the click was dispatched, and the click landed on whatever had taken its
   place. That is why the first attempt to change the language, or the theme,
   used to do nothing but start the sound, and why the second attempt worked.

   So for the one press that can do this, the button keeps the width it had
   when the finger landed, and gives it up on the frame after the finger
   lifts — by which time the click has been dispatched against the element
   that was actually pressed. Nothing is reserved and nothing is resized: the
   button is exactly as wide as its own label, a moment later than before.
   If the release is ever missed, the button simply stays at its widest,
   which is how it looked an instant earlier — the failure is invisible
   rather than wrong. */
let widthHeld = false;

addEventListener('pointerdown', ()=>{
  // capture phase, so this runs before the handlers that unlock the audio
  if(started || widthHeld) return;
  widthHeld = true;
  soundBtn.style.width = soundBtn.getBoundingClientRect().width + 'px';
}, true);

function releaseWidth(){
  if(!widthHeld) return;
  widthHeld = false;
  requestAnimationFrame(()=>{ soundBtn.style.width = ''; });
}
addEventListener('pointerup', releaseWidth, true);
addEventListener('pointercancel', releaseWidth, true);

soundBtn.addEventListener('click', e=>{
  e.preventDefault();
  if(!started || performance.now() - startedAt < 400){ startAudio(); blip(1320, 0.06); return; }
  soundOn = !soundOn;
  applyMaster();
  if(soundOn) blip(1320, 0.06);
  paintSound();
});

/* ══ theme ════════════════════════════════════════════════════════════════ */
const themeBtn = document.getElementById('theme');
const themeLabel = document.getElementById('themelabel');

function applyTheme(){
  const T = TH();
  document.body.classList.toggle('light', mode === 'light');
  themeLabel.textContent = mode === 'light' ? WORDS.tools.dark : WORDS.tools.light;
  themeBtn.setAttribute('aria-pressed', String(mode === 'light'));
  /* Under 420px the word is dropped and only the mark is left, and the mark
     is aria-hidden, so a screen reader would reach an unnamed button. The
     label is written out here so it says what it does at every width. */
  themeBtn.setAttribute('aria-label',
    mode === 'light' ? WORDS.tools.toDark : WORDS.tools.toLight);

  renderer.toneMappingExposure = T.exposure;
  scene.background = new THREE.Color(T.bg);
  scene.environment = envFor(mode);
  keyLight.intensity = T.keyI;
  rimLight.intensity = T.rimI;
  ambLight.intensity = T.ambI;
  ambLight.color = new THREE.Color(T.ambC);
  uKeyC.value.set(T.key);

  if(field){
    field.material.opacity = T.fieldOp;
    const c = new THREE.Color(T.field);
    for(let i=0;i<blocks.length;i++) field.setColorAt(i, c);
    field.instanceColor.needsUpdate = true;
  }
  if(ready){
    matte.material.color.set(T.matte);
    matte.material.roughness = T.matteRough;
    matte.material.metalness = T.matteMetal;
    outline.material.color.set(T.line);
    outline.material.opacity = T.lineOp;
    wire.material.color.set(T.line);
    wireThru.material.color.set(T.line);
  }
  syncDust();
  drawPoster(VW, VH, DPR);
}

themeBtn.addEventListener('click', ()=>{
  mode = mode === 'dark' ? 'light' : 'dark';
  applyTheme();
  blip(mode === 'light' ? 1560 : 1040, 0.05);
});

/* ══ layout ═══════════════════════════════════════════════════════════════ */
// everything measures the canvas itself. innerHeight lies on phones — the
// layout viewport runs behind the browser chrome — so the drawing buffer, the
// projection and the pointer maths are all pinned to the element's real box.
function chromeBands(){
  const hud = document.querySelector('.hud');
  const top = document.querySelector('.top');
  const bot = document.querySelector('.bot');
  const cs = hud ? getComputedStyle(hud) : null;
  const padT = cs ? (parseFloat(cs.paddingTop) || 0) : 24;
  const padB = cs ? (parseFloat(cs.paddingBottom) || 0) : 24;
  return {
    t: (top ? top.offsetHeight : 40) + padT,
    b: (bot ? bot.offsetHeight : 46) + padB + (stacked() ? 56 : 0)
  };
}

// the form is framed inside the space the interface leaves, not the whole screen
function fitView(){
  const r = canvas.getBoundingClientRect();
  VX = r.left; VY = r.top;
  VW = Math.max(1, Math.round(r.width));
  VH = Math.max(1, Math.round(r.height));

  const band = chromeBands();
  const freeH = Math.max(140, VH - band.t - band.b);
  const hFrac = stacked() ? 0.60 : 0.72;      // of the free band
  const wFrac = stacked() ? 0.74 : 0.60;      // of the full width
  const aspect = VW / VH;

  // the camera is framed against a fixed FIT×FIT reference box rather than
  // whichever shape is currently on screen, so swapping to a taller or wider
  // form never moves the camera itself — that would drag the background
  // field and everything else along with it. Only the form is rescaled, by
  // however much its own letterW/letterH fall short of the reference, so it
  // still lands on the same target fraction of the frame every time.
  visH = Math.max(FIT * VH / (freeH * hFrac), FIT / (wFrac * aspect), 3.4);
  camera.position.z = visH / (2*Math.tan(FOV*Math.PI/360));
  camera.aspect = aspect;
  camera.updateProjectionMatrix();

  const idealVisH = Math.max(letterH * VH / (freeH * hFrac), letterW / (wFrac * aspect), 3.4);
  formScaleGoal = visH / idealVisH;
  // the frame loop eases formScale toward this goal rather than snapping to
  // it here, so a model swap settles into its new size instead of popping.

  // put the form in the middle of the free band rather than the middle of the glass
  const centrePx = band.t + freeH/2;
  centreY = (VH/2 - centrePx) * (visH / VH);

  // the touch cue, and the line that replaces it, sit centred on the form
  cueY = centrePx;

  /* The line that comes after a form has stood up sits where the instruction
     did: centred on the form. It was below the whole composition for a while,
     clear of the ring and just above the readout, and it was legible there
     and almost never read — a sentence that only ever appears once, at the
     bottom edge, while the visitor is watching the shape they just made stand
     up, is a sentence that gets missed. Over the form it is where the eye
     already is, and the plate is what lets it survive being there — it
     arrives on a form that has just stopped moving and holds while the clay
     goes back to goo underneath it. */
}

function fitPoster(){
  const dist = camera.position.z - BACK_Z;
  const h = 2*Math.tan(FOV*Math.PI/360)*dist;
  poster.scale.set(h*camera.aspect, h, 1);
}

function resize(){
  fitView();
  renderer.setSize(VW, VH, false);
  fitPoster();
  sizeDust();
  drawPoster(VW, VH, DPR);
  placeChips();
  refreshExplore();
}
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize, 120));
if(window.visualViewport) visualViewport.addEventListener('resize', resize);
resize();
applyTheme();
// the bars change height once the webfont lands, so measure again
if(document.fonts && document.fonts.ready) document.fonts.ready.then(resize).catch(()=>{});
setTimeout(resize, 400);

/* ══ frame ════════════════════════════════════════════════════════════════ */
let first = true, last = performance.now(), fpsAcc = 0, fpsN = 0, bootP = 0;
let fieldTick = 0, fpsProbe = 0;

function frame(now){
  requestAnimationFrame(frame);
  // a hidden tab still gets rAF in some browsers, and a form nobody can see is
  // not worth a draw call. dt is clamped below, so coming back is smooth.
  if(document.hidden) return;
  // the cheap tier is held to 30. Below about 45 the drift reads as stutter
  // either way, so the second half of the budget buys nothing on screen -
  // handing it back to the main thread is what keeps scrolling, tapping and
  // the panel responsive, which is the part a visitor actually feels.
  if(cheap && now - last < 31) return;
  /* Clamped at both ends, and the low end is not paranoia. `last` is seeded
     from performance.now() while every frame after it carries the rAF
     timestamp, and those are not the same clock — the frame time is the start
     of the frame, so it can land before a performance.now() taken during the
     work that preceded it. One negative delta was enough to cure the clay on
     its own: the meter gives a hold back at `holdT - dt*CURE_UNDO`, and with
     dt negative that term adds six times its size, which cleared FORM_HOLD in
     a single frame. The mark then set itself, sounded its cure and took the
     next shape out of the bag with nobody touching it. Every other integrator
     here — the set, the dwell, the goo clock — was being run backwards by the
     same frame. */
  const dt = Math.min(0.05, Math.max(0, (now - last)/1000) || 0.016);
  last = now;
  clock += 0.0068;

  if(bootP < 100){
    bootP += ((ready ? 100 : 88) - bootP) * (ready ? 0.16 : 0.05);
    bootfill.style.width = Math.min(100, bootP) + '%';
    bootpct.textContent = String(Math.round(Math.min(100, bootP))).padStart(2,'0');
    if(ready && bootP > 99.2 && first){
      first = false;
      bootmsg.textContent = WORDS.boot.ready;
      boot.classList.add('gone');
      // the one moment the interface arrives; the cue is part of it
      bootDone = true; syncCue();
      setTimeout(()=>boot.remove(), 900);
    }
  }

  if(ready){
    intro = Math.min(1, intro + 0.009);
    const ease = 1 - Math.pow(1 - intro, 3);

    if(!touched || reduce){
      target.set(Math.sin(clock*1.1)*0.9, Math.cos(clock*0.72)*1.0, 0);
      rGoal = reduce ? 1 : 0.9;
    }

    radius += (rGoal - radius) * (rGoal < radius ? 0.14 : 0.055);   // quick to let go
    uC.value.lerp(target, touched ? 0.16 : 0.05);
    uR1.value = 0.62 * radius * ease;
    uR2.value = 1.02 * radius * ease;

    // wireframe reveal: mouse hover only — a touch device has no hover, so
    // coarse pointers never open the shell this way. An open panel is no
    // reason to withhold it: on a wide screen the form is still sitting there
    // beside the archive, and pointing at it should do what it always does.
    // On a narrow one the panel covers the form outright, and the hover test
    // already refuses anything inside .panel, so there is nothing to guard.
    const wantReveal = !coarse && hoverForm;
    reveal += ((wantReveal ? 1 : 0) - reveal) * (wantReveal ? 0.13 : 0.09);
    if(reveal < 0.002) reveal = 0;
    // pressing means the pointer is on the form, so the hover reveal would
    // otherwise be holding the solid open for the whole time the clay is
    // being worked — and a shape you can only see the armature of is not a
    // shape. It closes as the form sets: point at it and you get the
    // structure, press and you get the object.
    const revEff = reveal * (1 - sstep(setV/0.55));
    uReveal.value = revEff;
    // the hidden-line pass follows the reveal, a little under the front lines
    // so the near side of the mesh still reads as the near side
    wireThru.material.opacity = revEff * 0.42 * formFade;
    wireThru.visible = revEff > 0.01 && formFade > 0.02;

    // the turn about the local up axis, with weight — wheel, drag or flick
    spin += spinV;
    spinV *= reduce ? 0.7 : 0.945;
    if(Math.abs(spinV) < 0.00002) spinV = 0;

    // the tip from a vertical drag drifts back to level once the hand is off
    tilt += tiltV;
    tiltV *= reduce ? 0.7 : 0.9;
    if(Math.abs(tiltV) < 0.00002) tiltV = 0;
    if(!grab) tilt *= 0.992;
    tilt = THREE.MathUtils.clamp(tilt, -0.9, 0.9);

    // the form steps aside when the archive is open
    const gx = (panelOpen && VW > 900) ? -1.55 : 0;
    groupX += (gx - groupX) * 0.055;

    px += (mx - px)*0.04; py += (my - py)*0.04;
    group.rotation.y = spin + px*0.42 + Math.sin(clock*0.75)*0.13 + (1-ease)*0.8;
    group.rotation.x = -py*0.26 + Math.sin(clock*0.53)*0.08 + tilt;
    group.rotation.z = Math.sin(clock*0.41)*0.045;
    group.position.x = groupX;
    group.position.y = centreY + Math.sin(clock*1.15)*0.1;
    // the target size a swap asks for is reached gradually rather than in
    // one jump, so a much bigger or smaller form eases into place
    formScale += (formScaleGoal - formScale) * (reduce ? 0.18 : 0.09);

    group.scale.setScalar(formScale * (0.9 + 0.1*ease) * (panelOpen && VW > 900 ? 0.86 : 1));

    stepMorph(dt);
    applyFade(ease);

    let waveI = 0;
    if(wave){
      wave.t += dt;
      const k = wave.t / wave.life;
      if(k >= 1){
        wave = null; uPI.value = 0; uPR.value = 0;
      }else{
        const e2 = 1 - Math.pow(1 - k, 2.4);
        uPR.value = 0.02 + e2 * 3.6;
        uPI.value = Math.pow(1 - k, 1.7);
        waveI = uPI.value;
        waveWorld.copy(wave.local); group.localToWorld(waveWorld);
      }
    }
    if(cureFx){
      cureFx.t += dt;
      const k = cureFx.t / cureFx.life;
      if(k >= 1){
        cureFx = null; uPI.value = 0; uPR.value = 0;
      }else{
        uPC.value.copy(cureFx.local);
        /* 0.75 rather than a straight line: the radius falls slowly while the
           ring is out wide and quickly at the end, so it closes on the hand
           rather than drifting in at one rate. The tap does the opposite —
           leaves fast, slows as it goes — which is what makes this read as
           the same trip backwards. */
        uPR.value = 0.02 + 3.70 * Math.pow(1 - k, 0.75);
        /* Faint at the rim, brightest as it comes in, and it holds that most
           of the way home — the ninth power is what keeps it lit close to the
           centre and then takes it off sharply at the very end, so the ring
           arrives rather than fading out somewhere short of the hand. */
        uPI.value = 1.5 * Math.pow(k, 0.9) * (1 - Math.pow(k, 9));
        waveI = uPI.value;
        waveWorld.copy(cureFx.local); group.localToWorld(waveWorld);
      }
    }
    if(strike.visible){
      strike.intensity *= Math.pow(0.02, dt);
      if(strike.intensity < 0.05){ strike.intensity = 0; strike.visible = false; }
    }

    // the field is a slow background shimmer, and this is pure main-thread JS
    // over every cell plus a full instanceMatrix upload. At the cheap tier's
    // 30fps it reads the same at half that.
    if(!cheap || (fieldTick++ & 1)) updateField(ease, clock*8, waveWorld, uPR.value, waveI);
  }

  if(!coarse){
    retX += (pointerX - retX) * 0.42;
    retY += (pointerY - retY) * 0.42;
    ret.style.transform = 'translate(' + retX.toFixed(1) + 'px,' + retY.toFixed(1) + 'px) translate(-50%,-50%)';
  }

  renderer.render(scene, camera);

  fpsAcc += dt; fpsN++;
  if(fpsAcc >= 0.5){
    const fps = fpsN / fpsAcc;
    fpsOut.textContent = String(Math.round(fps)).padStart(2,'0');
    // The detection above runs before the first frame and, on iOS, close to
    // blind. This is the check that cannot be fooled: if the page is actually
    // slow, say so. Two consecutive bad half-seconds rather than one, so that
    // a GC pause or a decoding image does not demote a machine that is fine,
    // and only once the intro is over, since the intro is heavy everywhere.
    // What is left to give up at this point is the buffer size and the frame
    // rate - the shell and the mesh were built long ago and stay as they are.
    if(!cheap && ready && intro >= 1){
      if(fps < 40){
        if(++fpsProbe >= 2){
          cheap = true;
          DPR = 1; renderer.setPixelRatio(1);
          document.documentElement.classList.add('lo');
          resize();
        }
      }else fpsProbe = 0;
    }
    fpsAcc = 0; fpsN = 0;
  }
}
requestAnimationFrame(frame);

/* ══ content ══════════════════════════════════════════════════════════════
   Reads content.json, which tools/build-content.mjs regenerates from the
   repository on every push. Adding a project folder, dropping a logo into
   clients/ or replacing about/cv.pdf is the whole workflow — this file
   never needs to change. */

/* the one arrow, pointed wherever it is needed: 'r' 'l' 'd' 'ur' */
const ico_ = dir =>
  '<svg class="ico ico-'+dir+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
    '<path d="M3.2 12h16.2"/><path d="M13.4 6l6 6-6 6"/></svg>';

/* [label, value, href, mark] — mark is a direction for ico_ */
const rows_ = list => list.map(([label, value, href, mark]) => {
  const inner = esc(label) + '<em>' + esc(value) + (mark ? ico_(mark) : '') + '</em>';
  return href
    ? '<a href="'+esc(href)+'"'+(/^https?:/i.test(href) ? ' target="_blank" rel="noopener"' : '') +
      ' data-tag="'+esc(label)+'">'+inner+'</a>'
    : '<span>'+inner+'</span>';
}).join('');

const block_ = (title, inner) =>
  '<div class="block"><b>'+esc(title)+'</b><div class="rows">'+inner+'</div></div>';

/* same block furniture, chips instead of rows */
const tagblock_ = (title, items) =>
  '<div class="block"><b>'+esc(title)+'</b><div class="taglist">' +
  items.map(s=>'<span>'+esc(s)+'</span>').join('') + '</div></div>';

/* about.skills is [{ label, items }] — one block per group */
const skills_ = groups => (groups || [])
  .filter(g => g && g.items && g.items.length)
  .map(g => tagblock_((g.label || WORDS.block.skills).toUpperCase(), g.items))
  .join('');

const elsewhere_ = links => {
  const entries = Object.entries(links || {});
  return entries.length
    ? block_(WORDS.block.elsewhere, rows_(entries.map(([k, v]) => [k.toUpperCase(), '', v, 'ur'])))
    : '';
};

/* Built from parts at runtime. The address is never present as a single
   string in the HTML or in content.json, so a scraper grepping the source
   for an address pattern comes away with nothing. */
function mailLink(email){
  if(!email || !email.user || !email.domain || !email.tld) return '';
  const at = String.fromCharCode(64);
  const addr = email.user + at + email.domain + '.' + email.tld;
  return '<a class="mail" href="#" data-mail="'+esc(addr)+'" data-tag="'+esc(WORDS.tag.email)+'" ' +
    'rel="nofollow noreferrer">' + esc(addr) + '</a>';
}

function buildPages(c){
  const site = c.site || {};
  const about = c.about || {};
  const clients = c.clients || {};
  const pages = {};

  /* ── ABOUT ── */
  const shot = about.portrait
    ? '<figure class="shot">' +
        '<img src="'+esc(about.portrait)+'" alt="'+esc(site.name || '')+'" loading="lazy" decoding="async">' +
        (about.caption ? '<i>'+esc(about.caption)+'</i>' : '') +
      '</figure>'
    : '';

  const paras = (about.paragraphs || []);
  const cv = about.cv;

  pages.ABOUT = {
    sub: (site.role || WORDS.page.profile).toUpperCase(),
    html: ()=>
      '<div class="who">' +
        (about.headline ? '<h3>'+esc(about.headline)+'</h3>' : '') +
        shot +
        '<div class="said">' + paras.map(p=>'<p>'+p+'</p>').join('') + '</div>' +
      '</div>' +
      skills_(about.skills) +
      (cv ? block_(WORDS.block.documents, rows_([[
        WORDS.block.cv,
        WORDS.block.pdf + ' · ' + cv.size + ' · ' + cv.updated,
        cv.src + (cv.hash ? '?v=' + cv.hash : ''),
        'd'
      ]])) : '') +
      elsewhere_(site.links)
  };

  /* ── CLIENTS ── */
  const logos = clients.logos || [];
  const tiles = logos.length
    ? logos.map((l,i)=>'<div class="client">' +
        (l.src
          ? '<img src="'+esc(l.src)+'" alt="'+esc(l.name)+'" loading="lazy" decoding="async">'
          : mark(i)) +
        '<b>'+esc(String(l.name).toUpperCase())+'</b></div>').join('')
    : '';

  const engagements = clients.engagements || [];

  pages.CLIENTS = {
    sub: String(logos.length).padStart(2,'0') + ' ' + WORDS.page.organisations,
    html: ()=>
      (clients.lede ? '<p class="lede">'+esc(clients.lede)+'</p>' : '') +
      (tiles ? '<div class="clients">'+tiles+'</div>' : '') +
      (engagements.length
        ? block_(WORDS.block.engagements, rows_(engagements.map(e=>[e.name, e.year || ''])))
        : '') +
      (logos.length ? '' : '<p class="note">'+esc(WORDS.page.noLogos)+'</p>')
  };

  /* ── CONTACT ── */
  const details = Object.entries(site.details || {});

  pages.CONTACT = {
    sub: WORDS.page.touch,
    html: ()=>
      '<p class="lede">'+esc(WORDS.page.lede)+'</p>' +
      mailLink(site.email) +
      elsewhere_(site.links) +
      (details.length
        ? block_(WORDS.block.details, rows_(details.map(([k,v])=>[k.toUpperCase(), v])))
        : '')
  };

  return pages;
}

/* the href stays inert in the markup; the real one is built on click */
document.addEventListener('click', e=>{
  const a = e.target.closest && e.target.closest('a[data-mail]');
  if(!a) return;
  e.preventDefault();
  location.href = 'mailto:' + a.dataset.mail;
});

/* ══ the interface, in whichever language ═════════════════════════════════
   Everything the chrome says about itself, written out of `T` in one place.
   It runs at boot and again on every switch, which is why it sets values
   rather than toggling them: after it has run, no element is still carrying
   a word from the language before.

   The `data-tag` attributes are part of this. They are what the reticle
   reads out under the pointer, so leaving them behind would have the cursor
   narrating a translated interface in the language it was written in — the
   one place a missed string would be loudest. */
function paintChrome(){
  markDocument();

  document.querySelectorAll('.menu [data-page]').forEach(b=>{
    const label = WORDS.nav[b.dataset.page] || b.dataset.page;
    b.querySelector('b').textContent = label;
    b.dataset.tag = label;
  });

  const set = (id, text) => { const el = document.getElementById(id); if(el) el.textContent = text; };
  const tag = (id, value) => { const el = document.getElementById(id); if(el) el.dataset.tag = value; };
  const aria = (id, value) => { const el = document.getElementById(id); if(el) el.setAttribute('aria-label', value); };

  /* the readout labels; the values beside them are written every frame */
  const labels = document.querySelectorAll('.readout > span > b');
  const order = [WORDS.readout.form, WORDS.readout.practice, WORDS.readout.render];
  labels.forEach((b, i) => { if(order[i]) b.textContent = order[i]; });
  const render = document.querySelector('.readout > span:nth-child(3)');
  if(render) render.lastChild.textContent = ' ' + WORDS.readout.fps;

  set('bootmsg', bootDone ? WORDS.boot.ready : WORDS.boot.init);
  set('rights', '© ' + new Date().getFullYear() + ' ' + WORDS.rights);

  /* The cue is the one label with two lives — the instruction, then the
     sentence. Whichever it is holding now is the one that gets rewritten. */
  cue.textContent = creedState === 1 ? WORDS.cue.creed : WORDS.cue.hold;
  syncTag();

  pBack.textContent = fieldIx < 0 ? WORDS.panel.top : WORDS.panel.index;
  const closeLbl = pClose.querySelector('.lbl');
  if(closeLbl) closeLbl.textContent = WORDS.panel.close;

  tag('pprev', WORDS.tag.prev);   aria('pprev', WORDS.aria.prev);
  tag('pnext', WORDS.tag.next);   aria('pnext', WORDS.aria.next);
  tag('pback', WORDS.tag.back);
  tag('pclose', WORDS.tag.close); aria('pclose', WORDS.aria.close);
  tag('lensclose', WORDS.tag.close); aria('lensclose', WORDS.aria.close);
  tag('lensprev', WORDS.tag.prev);   aria('lensprev', WORDS.aria.prevImg);
  tag('lensnext', WORDS.tag.next);   aria('lensnext', WORDS.aria.nextImg);
  aria('lens', WORDS.aria.images);
  tag('theme', WORDS.tag.theme);
  tag('sound', WORDS.tag.audio);

  const group = document.getElementById('lang');
  if(group) group.setAttribute('aria-label', WORDS.tools.language);

  paintSound();
  applyTheme();

  /* the readout is compared against its last value before it repaints, so
     the old language's word has to stop counting as current */
  matState = '';
}

/* ── the switcher ─────────────────────────────────────────────────────────
   Three buttons, each labelled in its own language. The address is kept in
   step with a replaceState rather than a navigation: the visitor's history
   should record where they went on the site, not how many times they changed
   their mind about the language, and a reload would throw away a form that
   took a second and a half to build. */
const langGroup = document.getElementById('lang');

function buildLangs(){
  if(!langGroup) return;
  langGroup.innerHTML = '';
  LOCALES.forEach(code=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.lang = code;
    b.textContent = LOCALE_LABEL[code] || code.toUpperCase();
    b.dataset.lang = code;
    b.dataset.tag = LOCALE_NAME[code] || code;
    b.setAttribute('aria-label', LOCALE_NAME[code] || code);
    b.addEventListener('pointerenter', ()=>blip(1180, 0.03));
    b.addEventListener('click', ()=>{ startAudio(); setLang(code); });
    langGroup.appendChild(b);
  });
  markLangs();
}

function markLangs(){
  if(!langGroup) return;
  langGroup.querySelectorAll('button').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
}

/* The address says which language is on screen, whether the visitor asked
   for it in the URL or the browser remembered it from last time. Without
   this a returning French reader is on a bare `/` that would hand an English
   page to whoever they sent it to — the link would be lying about what they
   were looking at. The default language is the bare address, so there is
   exactly one canonical URL and not two spellings of it. */
function syncUrl(){
  const url = new URL(location.href);
  const had = url.searchParams.get('lang');
  if(LANG === DEFAULT_LOCALE) url.searchParams.delete('lang');
  else url.searchParams.set('lang', LANG);
  if(url.href !== location.href || had !== url.searchParams.get('lang')){
    history.replaceState(null, '', url);
  }
}

function setLang(code){
  if(!LOCALES.includes(code) || code === LANG) return;
  LANG = code;
  WORDS = STRINGS[code] || STRINGS[DEFAULT_LOCALE];

  try{ localStorage.setItem('lang', code); }catch(err){}
  syncUrl();

  markLangs();
  paintChrome();
  loadContent();
  blip(1240, 0.05);
}

/* ══ content ══════════════════════════════════════════════════════════════ */

/* Which panel is up, so a language change can put the visitor back where
   they were rather than closing the thing they were reading. */
let panelState = null;

function restorePanel(){
  if(!panelOpen || !panelState) return;
  const s = panelState;
  if(s.kind === 'page') openPage(s.key);
  else if(s.kind === 'field') openField(s.i, true);
  else if(FIELDS[s.i] && FIELDS[s.i].works[s.k]){ openField(s.i, true); openWork(s.k); }
  else openField(Math.min(s.i, FIELDS.length - 1), true);
}

function applyContent(c){
  FIELDS = c.fields || [];
  PAGES = buildPages(c);

  const site = c.site || {};
  /* The name and the role are content, not chrome — they are in every
     content.json already, and reading them from there is what keeps a
     translated page from introducing its author in English. */
  const name = document.querySelector('.mark-name');
  const role = document.querySelector('.mark-sub');
  if(name && site.name) name.textContent = site.name;
  if(role && site.role) role.textContent = String(site.role).toUpperCase();

  /* The tab is chrome the browser owns, but its words are content: a French
     page announcing itself in English in the tab strip is the same mistake as
     a French page with an English nav. The build writes the served <title>
     for the default language and the crawlers read that one; this is for the
     visitor who switched. */
  if(site.name) document.title = [site.name, site.role].filter(Boolean).join(' — ');

  const practice = document.getElementById('practice');
  if(FIELDS.length) practice.textContent = FIELDS.map(f=>f.key).join(' / ');

  buildChips();
  placeChips();
  refreshExplore();
  warmCovers();
  restorePanel();
}

/* The default language keeps the plain filename the build has always
   written, so nothing about the English page changed; the others sit beside
   it. `no-cache` is kept from before — the file is regenerated on every
   push and a stale copy is a wrong site, not a slow one. */
const contentFile = () => LANG === DEFAULT_LOCALE ? 'content.json' : 'content.' + LANG + '.json';

function loadContent(){
  const want = LANG;
  const file = contentFile();
  return fetch(file, { cache: 'no-cache' })
    .then(r=>{ if(!r.ok) throw new Error(file + ' → HTTP ' + r.status); return r.json(); })
    /* Two quick switches can land their responses out of order; the slower
       one must not overwrite the language the visitor actually settled on. */
    .then(c=>{ if(want === LANG) applyContent(c); })
    .catch(err=>{
      console.error('[content]', err);
      if(want !== LANG) return;
      document.getElementById('practice').textContent = WORDS.error.readout;
      PAGES = { ABOUT: { sub: WORDS.error.sub, html:()=>
        '<p class="lede">' + esc(WORDS.error.lede) + '</p>' +
        '<p class="note">' + WORDS.error.note + '</p>' } };
    });
}

buildLangs();
syncUrl();
paintChrome();
loadContent();
</script>
