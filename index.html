<!-- three.js is fetched from unpkg the moment the module graph resolves, and
     the connection costs a DNS lookup plus a TLS handshake the page would
     otherwise pay for only after parsing. Warm it while the CSS is in flight. -->
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<style>
  :root{
    --void:#070708;
    --ice:#f3f3f3;
    --mute:#b7babc;
    --dim:#83878a;
    --key:#ffffff;
    --line:rgba(255,255,255,.26);
    --hair:rgba(255,255,255,.12);
    --plate:rgba(8,9,10,.62);
    --sheet:rgba(9,10,11,.86);
    --tsh:0 1px 10px rgba(0,0,0,.95);
    --scan:rgba(255,255,255,.045);
    --scan-op:.4;
    --sweep:rgba(255,255,255,.05);
    --scrim-a:rgba(0,0,0,.55);
    --scrim-b:rgba(0,0,0,.70);
    --vig:rgba(0,0,0,.82);
    --grain-op:.11;
    --glow:rgba(255,255,255,.6);
    --lens:rgba(4,4,5,.93);
    /* placeholder artwork palette */
    --ph0:#0c0d0f; --ph1:#191b1e; --ph2:#2e3338; --ph3:#e9eaec;
  }
  body.light{
    --void:#edebe6;
    --ice:#16171a;
    --mute:#4c5052;
    --dim:#7d8184;
    --key:#0b0b0c;
    --line:rgba(12,12,14,.32);
    --hair:rgba(12,12,14,.16);
    --plate:rgba(255,255,255,.55);
    --sheet:rgba(245,243,239,.9);
    --tsh:0 1px 10px rgba(255,255,255,.85);
    --scan:rgba(0,0,0,.03);
    --scan-op:.35;
    --sweep:rgba(255,255,255,.55);
    --scrim-a:rgba(150,146,138,.16);
    --scrim-b:rgba(150,146,138,.22);
    --vig:rgba(122,118,110,.30);
    --grain-op:.07;
    --glow:rgba(0,0,0,.35);
    --lens:rgba(238,236,231,.95);
    --ph0:#e3e0d9; --ph1:#d4d0c7; --ph2:#b6b1a6; --ph3:#17181a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--void);color:var(--ice);
    font-family:'Archivo',system-ui,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
    transition:background .7s ease,color .7s ease;
  }
  @media (pointer:fine){
    html,body,#gl,.hud,.hud a,.fx,.chip,.panel,.panel *,.lens,.lens *,button{cursor:none}

    /* ── the pointer comes back for fullscreen video ────
       The reticle that stands in for the cursor is an element of the page,
       and a fullscreen <video> paints over the page entirely — so inside
       fullscreen there was nothing to aim with at all: the custom cursor was
       covered along with everything else, and the real one was suppressed by
       the rule above. That left the browser's own control bar as the only way
       back out and no way to point at it, so Esc was the only exit. While
       anything is fullscreen the real cursor is handed back. Both the
       standard and the -webkit- selector are written as separate rules, since
       a browser that does not know one of them would drop the whole list. */
    :fullscreen,:fullscreen *{cursor:auto}
    :-webkit-full-screen,:-webkit-full-screen *{cursor:auto}
    body.fs,body.fs *{cursor:auto}
  }
  #gl{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;
    display:block;z-index:0;touch-action:none}

  /* ── the photographs are not for taking ───────────────
     no drag ghost on the desktop, no long-press callout on iOS, no
     selection handles. The contextmenu handler in the script closes the
     right-click and long-press menus themselves. */
  img{-webkit-user-select:none;user-select:none;-webkit-user-drag:none;
    -webkit-touch-callout:none}
  .lens,.lens *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

  /* ── screen treatment ─────────────────────────────── */
  .fx{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;
    z-index:2;pointer-events:none;overflow:hidden}
  .scan{position:absolute;inset:0;opacity:var(--scan-op);mix-blend-mode:screen;
    background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px)}
  body.light .scan{mix-blend-mode:multiply}
  .scrim{position:absolute;inset:0;background:linear-gradient(to bottom,
    var(--scrim-a) 0,rgba(0,0,0,0) 24%,rgba(0,0,0,0) 58%,var(--scrim-b) 100%)}
  .sweep{position:absolute;left:0;right:0;height:140px;top:-140px;
    background:linear-gradient(to bottom,transparent,var(--sweep),transparent);
    animation:sweep 11s linear infinite}
  @keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(calc(100vh + 280px))}}
  .vig{position:absolute;inset:0;background:radial-gradient(115% 85% at 50% 46%,transparent 38%,var(--vig) 100%)}
  .grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:var(--grain-op);mix-blend-mode:overlay;
    background-repeat:repeat;background-size:180px 180px}

  /* ── reticle ──────────────────────────────────────── */
  .ret{position:fixed;left:0;top:0;z-index:14;pointer-events:none;opacity:0;
    transform:translate(-50%,-50%);transition:opacity .25s}
  .ret.on{opacity:1}
  .ret svg{display:block;overflow:visible;transform:scale(.62) rotate(0deg);
    transition:transform .28s cubic-bezier(.2,.8,.3,1)}
  .ret path{fill:none;stroke:var(--mute);stroke-width:1.4;transition:stroke .25s}
  .ret circle{fill:var(--mute);transition:fill .25s}
  .ret.lock svg{transform:scale(1) rotate(45deg)}
  .ret.lock path,.ret.lock circle{stroke:var(--key);fill:var(--key)}
  .ret .tag{position:absolute;left:46px;top:50%;transform:translate(6px,-50%);
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.26em;
    color:var(--ice);background:var(--sheet);border:1px solid var(--hair);
    padding:5px 8px;opacity:0;white-space:nowrap;
    transition:opacity .25s,transform .25s}
  .ret.lock .tag{transform:translate(0,-50%);opacity:.92}
  .ret .tag:empty{display:none}

  /* a phone has no reticle to hang the instruction off, so it goes under the
     form instead — same sentence, same job, and gone the moment it has been
     acted on. Sized and clipped like the chips so it reads as one of them. */
  .cue{position:fixed;left:0;top:0;z-index:13;pointer-events:none;
    transform:translate(-50%,-50%) translateY(7px);opacity:0;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.26em;
    color:var(--ice);background:var(--sheet);border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    padding:7px 10px;white-space:nowrap;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
    transition:opacity .5s cubic-bezier(.2,.8,.3,1),transform .5s cubic-bezier(.2,.8,.3,1)}
  .cue.on{opacity:.92;transform:translate(-50%,-50%)}
  /* The instruction is two words and can hold one line anywhere. The line that
     replaces it is a sentence in two clauses, and it is centred rather than
     left to sit in a single row.

     It is not allowed to wrap. The break between the clauses is written into
     the string, and white-space:pre keeps that break the only one there is:
     held to a measure instead, the box ran out mid-clause on a phone and a
     sentence meant as two balanced lines came apart into four ragged ones.
     Nothing here needs the wrapping — at this size the longer of the two
     clauses is around 180px, which every screen the site is served on can
     hold, so the box simply takes the width of its longest line.

     It keeps a ground, unlike the caption it used to be. Set below the whole
     composition with nothing round it, it was clear of everything but also
     far enough down the viewport to be missed entirely — the eye is on the
     form it just made, not on the bottom edge. So it goes back over the form,
     where the eye already is, and the ground is what makes that readable: a
     shape is moving behind it, and eight-point letters set straight on live
     clay are not text, they are noise.

     What it does drop is the chip's frame. The hairline and the cut corner
     are what make the instruction read as a control worth acting on; this one
     is not asking for anything, and framed the same way it reads as a second
     piece of interface. A plain rectangle of blurred ground, no border and no
     notch — a plate to be read off, not a button.

     A soft-edged plate was tried and is not what this wants: masked out to
     nothing at its edges it stops being a plate and becomes a haze, and the
     interface everywhere else on this page is built out of squared-off
     surfaces that begin and end where they say they do. The edge stays.

     It takes --plate rather than the chip's --sheet, which is the whole point
     of the plate: at .86 alpha a backdrop blur sits behind an almost solid
     wall and does nothing you can see. --plate is the token for the surfaces
     meant to be seen through, and at .62 the clay stays legible behind the
     words as a soft moving ground. Blurred harder than the chips are, because
     what is behind this one is the busiest thing on the page. */
  .cue.creed{white-space:pre;max-width:none;text-align:center;line-height:1.75;
    background:var(--plate);border:0;padding:12px 16px;clip-path:none;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

  /* ── hud shell ────────────────────────────────────── */
  .hud{position:relative;z-index:3;height:100vh;height:100dvh;display:flex;flex-direction:column;
    justify-content:space-between;padding:clamp(20px,3vw,36px);pointer-events:none}
  .brackets{position:absolute;inset:0;pointer-events:none}
  .brackets i{position:absolute;width:24px;height:24px;border:1px solid var(--line)}
  .brackets .tl{left:clamp(12px,1.8vw,20px);top:clamp(12px,1.8vw,20px);border-right:0;border-bottom:0}
  .brackets .tr{right:clamp(12px,1.8vw,20px);top:clamp(12px,1.8vw,20px);border-left:0;border-bottom:0}
  .brackets .bl{left:clamp(12px,1.8vw,20px);bottom:clamp(12px,1.8vw,20px);border-right:0;border-top:0}
  .brackets .br{right:clamp(12px,1.8vw,20px);bottom:clamp(12px,1.8vw,20px);border-left:0;border-top:0}

  .hud a,.hud button{pointer-events:auto;text-decoration:none;color:inherit;
    font:inherit;background:none;border:0;-webkit-tap-highlight-color:transparent}
  .hud a:focus-visible,.hud button:focus-visible{outline:1px solid var(--ice);outline-offset:5px}

  /* ── top row ──────────────────────────────────────── */
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
  .mark{display:flex;align-items:flex-start;gap:12px;
    --markh:calc(12.5px*1.5 + 3px + 8.5px*1.35)}

  /* ── the mark ───────────────────────────────────
     The glyph stands where the initials used to, and squares off against the
     two lines beside it: --markh is their stacked height written out — the
     name's 12.5/1.5 box, the 3px above the sub, the sub's 8.5/1.35 — which is
     why .mark-sub is pinned to a ratio rather than left on 'normal'. Summing
     it by hand beats height:100%, which cannot be resolved against a flex
     line the image itself is sizing and so snaps back to the file's own 270px.
     The art is black-on-transparent, which is the light-mode reading; dark
     mode flips its polarity so the glyph holds the HUD's contrast either way,
     on the same .7s as the body's own theme crossfade. */
  .mark-id{flex:0 0 auto;display:block}
  .mark-id img{height:var(--markh);width:auto;display:block;
    filter:invert(1) drop-shadow(var(--tsh));transition:filter .7s ease}
  body.light .mark-id img{filter:drop-shadow(var(--tsh))}
  .mark-name{display:block;text-transform:uppercase;font-weight:600;font-size:12.5px;letter-spacing:.16em;line-height:1.5;
    text-shadow:var(--tsh)}
  .mark-sub{display:block;font-family:'Azeret Mono',ui-monospace,monospace;font-weight:300;
    font-size:8.5px;line-height:1.35;letter-spacing:.24em;color:var(--mute);margin-top:3px;
    text-shadow:var(--tsh)}

  .menu{display:flex;gap:8px}
  .hud .menu a,.hud .menu button{position:relative;display:flex;align-items:center;gap:9px;
    padding:9px 14px 9px 12px;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.2em;
    color:var(--mute);background:var(--plate);border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    transition:color .22s,border-color .22s,background .22s;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
  .hud .menu a i,.hud .menu button i{font-style:normal;font-size:8px;color:var(--dim);transition:color .22s}
  .hud .menu a::before,.hud .menu button::before{content:"";position:absolute;left:0;top:50%;width:1px;height:0;
    background:var(--void);transform:translateY(-50%);transition:height .25s}
  .hud .menu a:hover,.hud .menu a:focus-visible,
  .hud .menu button:hover,.hud .menu button:focus-visible{color:var(--void);background:var(--ice);border-color:var(--ice)}
  .hud .menu a:hover::before,.hud .menu button:hover::before{height:70%}
  .hud .menu a:hover i,.hud .menu button:hover i{color:var(--void)}
  .hud .menu a:active,.hud .menu button:active{background:var(--mute)}

  /* ── bottom row ───────────────────────────────────── */
  .bot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.18em}
  .readout{display:flex;flex-direction:column;gap:5px;color:var(--ice);text-shadow:var(--tsh)}
  .readout span{display:flex;gap:10px}
  .readout b{font-weight:400;color:var(--dim);min-width:66px}
  .readout em{font-style:normal}
  /* how far the hold has got. It only exists while a hand is on the clay, so
     the line below the model is a readout at rest and an instrument in use */
  .cure{align-self:center;width:58px;height:3px;background:var(--hair);
        border:1px solid var(--hair);opacity:0;transition:opacity .28s ease;
        overflow:hidden;flex:0 0 auto}
  .cure.on{opacity:1}
  .cure u{display:block;height:100%;width:100%;text-decoration:none;
          background:var(--mute);transform:scaleX(0);transform-origin:left center}
  .cure.done u{background:var(--key)}
  .cure.done{border-color:var(--line)}
  .tail{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .tools{display:flex;align-items:center;gap:8px}
  .hud .tgl{display:flex;align-items:center;gap:7px;color:var(--mute);background:var(--plate);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.2em;
    border:1px solid var(--hair);padding:7px 10px;
    transition:color .25s,border-color .25s,background .25s;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
  .hud .tgl i{font-style:normal;font-size:10px;line-height:1;color:var(--dim);transition:color .25s;
    display:flex;align-items:center}
  /* The mark is one drawing for both themes: a sun whose disc is bitten by a
     crescent. Mirroring it moves the crescent to the other side, so the two
     states read as opposites without a second file to keep in step. The box is
     a fixed 11px either way, so nothing in .tools shifts when it turns. */
  .hud .tgl i svg{width:11px;height:11px;display:block;fill:currentColor;
    transition:transform .45s cubic-bezier(.22,1,.36,1)}
  body.light .hud .tgl i svg{transform:scaleX(-1)}
  @media (prefers-reduced-motion:reduce){.hud .tgl i svg{transition:none}}
  .hud .tgl b{font-weight:400;min-width:34px;text-align:left}
  .hud .tgl:hover{color:var(--ice);border-color:var(--line)}
  .hud .tgl:hover i{color:var(--ice)}
  .hud .sound{display:flex;align-items:center;gap:7px;color:var(--mute);background:var(--plate);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.2em;
    border:1px solid var(--hair);padding:7px 10px;transition:color .25s,border-color .25s;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
  .hud .sound:hover{color:var(--ice);border-color:var(--line)}
  .hud .sound.live{color:var(--ice)}
  .bars{display:flex;align-items:flex-end;gap:2px;height:9px}
  .bars i{display:block;width:2px;height:3px;background:var(--dim);transition:background .3s}
  .sound.live .bars i{background:var(--ice);box-shadow:0 0 6px var(--glow);
    animation:vu 1.15s ease-in-out infinite}
  .sound.live .bars i:nth-child(2){animation-duration:.78s;animation-delay:.18s}
  .sound.live .bars i:nth-child(3){animation-duration:1.42s;animation-delay:.06s}
  .sound.live .bars i:nth-child(4){animation-duration:.94s;animation-delay:.3s}
  @keyframes vu{0%,100%{height:2px}50%{height:9px}}

  /* ── explore chips around the form ────────────────── */
  .explore{position:fixed;inset:0;z-index:4;pointer-events:none}
  .chip{position:absolute;transform:translate(-50%,-50%) scale(.82);
    display:flex;align-items:center;gap:9px;padding:9px 14px;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:9px;letter-spacing:.22em;
    color:var(--mute);background:var(--sheet);border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;white-space:nowrap;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
    transition:opacity .42s cubic-bezier(.2,.8,.3,1),transform .42s cubic-bezier(.2,.8,.3,1),
               color .25s,border-color .25s,background .25s}
  .chip i{font-style:normal;color:var(--dim);font-size:8px}
  .explore.on .chip{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
  .chip.hot{color:var(--void);background:var(--ice);border-color:var(--ice);
    transform:translate(-50%,-50%) scale(1.06)}
  .chip.hot i{color:var(--void)}

  /* ── work panel ───────────────────────────────────── */
  .panel{position:fixed;top:0;right:0;bottom:0;z-index:7;
    width:min(560px,48vw);display:flex;flex-direction:column;
    background:var(--sheet);border-left:1px solid var(--hair);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transform:translateX(102%);opacity:0;visibility:hidden;
    transition:transform .62s cubic-bezier(.16,.84,.28,1),opacity .5s ease,visibility .62s}
  .panel.on{transform:none;opacity:1;visibility:visible}
  .panel-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:16px clamp(16px,2.4vw,26px);border-bottom:1px solid var(--hair);
    font-family:'Azeret Mono',ui-monospace,monospace}
  /* The bar is one line whatever the field is called. Without min-width:0 a
     flex item refuses to shrink below its content, so on a 320px screen
     "12 WORKS — MARKS & IDENTITY" wrapped to three lines and pushed the bar
     to twice its height; the nav keeps its natural width and the title takes
     what is left, clipped rather than folded. */
  .panel-title{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 auto}
  .panel-title b,.panel-title i{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .panel-title b{font-weight:500;font-size:12px;letter-spacing:.24em;color:var(--ice)}
  .panel-title i{font-style:normal;font-size:8px;letter-spacing:.22em;color:var(--dim)}
  .panel-nav{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .pbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    height:30px;padding:0 10px;line-height:1;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:9px;letter-spacing:.18em;
    color:var(--mute);border:1px solid var(--hair);background:transparent;
    transition:color .2s,background .2s,border-color .2s,opacity .3s}
  .pbtn:hover{color:var(--void);background:var(--ice);border-color:var(--ice)}
  .pbtn[hidden]{display:none}
  /* icon-only buttons are square, so PREV and NEXT are the same box */
  .pbtn.ibtn{width:30px;padding:0}

  /* ── marks ────────────────────────────────────────────
     One geometry, rotated. These used to be text — &larr;
     &rarr; \2197 \2193 — but Azeret Mono's latin subset
     carries only some of those codepoints, so the rest fell
     through to whatever the device had. Each direction then
     arrived at a different width and weight, which is why the
     right arrow read bigger than the left one on a phone.
     Drawn as SVG they are the same shape at every size,
     independent of the font that happens to load. */
  .ico{display:block;flex:0 0 auto;width:var(--ico,12px);height:var(--ico,12px);
    fill:none;stroke:currentColor;stroke-width:2;
    transform-origin:50% 50%}
  .ico-r {transform:rotate(0deg)}     /* next     */
  .ico-l {transform:rotate(180deg)}   /* previous */
  .ico-d {transform:rotate(90deg)}    /* download */
  .ico-ur{transform:rotate(-45deg)}   /* outbound */
  .panel-body{position:relative;flex:1;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
    padding:clamp(16px,2.4vw,26px);
    transition:opacity .42s ease,transform .42s cubic-bezier(.2,.8,.3,1)}
  .view.hide{opacity:0;transform:translateY(14px);pointer-events:none}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{display:block;text-align:left;padding:0;border:1px solid var(--hair);background:transparent;
    opacity:0;transform:translateY(16px);
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.3,1),border-color .25s}
  .panel.on .card{opacity:1;transform:none}
  .card:hover{border-color:var(--line)}
  .card .thumb{position:relative;aspect-ratio:16/9;overflow:hidden;display:block}
  .card .thumb svg{width:100%;height:100%;display:block;transition:transform .55s cubic-bezier(.2,.8,.3,1)}
  .card:hover .thumb svg{transform:scale(1.05)}
  .card .meta{display:block;padding:13px 15px 14px;border-top:1px solid var(--hair);
    font-family:'Azeret Mono',ui-monospace,monospace;transition:border-color .25s}
  .card:hover .meta{border-color:var(--line)}
  .card .meta b{display:block;font-weight:500;font-size:9.5px;letter-spacing:.16em;
    line-height:1.5;color:var(--ice);overflow-wrap:anywhere}
  .card .meta span{display:block;margin-top:7px;font-size:8px;letter-spacing:.2em;
    line-height:1.5;color:var(--dim)}

  .page{display:flex;flex-direction:column;gap:22px}
  /* Portrait and prose share one grid. A headline, if there is one, spans
     both columns so it gets the full measure instead of breaking repeatedly
     in a narrow one; under it the portrait sits beside the bio. On a phone
     the whole thing collapses to a single column with the portrait leading. */
  .who{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);
    gap:0 clamp(16px,2.2vw,24px);align-items:start}
  .who > h3{grid-column:1/-1;margin-bottom:clamp(14px,1.8vw,20px)}
  .who .shot{position:relative;width:100%;border:1px solid var(--hair);
    overflow:hidden;line-height:0}
  .who .shot img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;
    filter:grayscale(1) contrast(1.04);transition:filter .5s ease,opacity .5s ease}
  body.light .who .shot img{filter:grayscale(1) contrast(1.02) brightness(1.02)}
  .who .shot::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px);
    opacity:.5;mix-blend-mode:overlay}
  .who .shot i{position:absolute;left:0;bottom:0;right:0;font-style:normal;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:7px;letter-spacing:.22em;
    color:var(--ice);background:var(--sheet);border-top:1px solid var(--hair);
    padding:4px 6px;text-align:center;line-height:1.4}
  .who .said{min-width:0}
  .page h3{font-weight:700;font-size:clamp(19px,2.3vw,26px);letter-spacing:-.01em;
    line-height:1.15;color:var(--ice)}
  .page p{font-size:12.5px;line-height:1.6;color:var(--mute)}
  .page p + p{margin-top:9px}
  .block{display:flex;flex-direction:column;gap:8px;
    padding-top:18px;border-top:1px solid var(--hair)}
  .block > b{font-family:'Azeret Mono',ui-monospace,monospace;font-weight:400;
    font-size:8px;letter-spacing:.26em;color:var(--dim)}
  .rows{display:flex;flex-direction:column}
  .rows a,.rows span{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    padding:11px 0;border-bottom:1px solid var(--hair);text-decoration:none;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;
    color:var(--ice);transition:color .2s,padding-left .25s}
  .rows a:hover{color:var(--dim);padding-left:8px}
  .rows em{display:flex;align-items:center;justify-content:flex-end;gap:.85em;align-self:center;
    font-style:normal;color:var(--dim);font-size:8.5px;letter-spacing:.2em;text-align:right}
  .rows em .ico{--ico:11px}

  /* skill tags — same chip as a project's tag row, so the two read as one
     family. Each group is its own .block, matching DOCUMENTS / ELSEWHERE. */
  .taglist{display:flex;flex-wrap:wrap;gap:6px}
  .taglist span{font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;
    letter-spacing:.16em;color:var(--mute);border:1px solid var(--hair);padding:6px 9px;
    transition:border-color .25s,color .25s}
  .taglist span:hover{border-color:var(--line);color:var(--ice)}
  .lede{font-size:13.5px;line-height:1.6;color:var(--mute)}
  .mail{font-weight:700;font-size:clamp(17px,2.4vw,25px);letter-spacing:-.01em;
    color:var(--ice);text-decoration:none;word-break:break-all}
  .mail:hover{color:var(--dim)}
  .clients{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .client{border:1px solid var(--hair);display:flex;flex-direction:column;gap:0;
    transition:border-color .25s}
  .client:hover{border-color:var(--line)}
  .client svg{width:100%;aspect-ratio:3/2;display:block}
  .client b{font-family:'Azeret Mono',ui-monospace,monospace;font-weight:400;font-size:7.5px;
    letter-spacing:.18em;color:var(--dim);padding:0 0 9px;text-align:center}
  .note{font-family:'Azeret Mono',ui-monospace,monospace;font-size:8px;letter-spacing:.2em;
    color:var(--dim);line-height:1.8}

  .detail-img{border:1px solid var(--hair);aspect-ratio:10/7;overflow:hidden}
  .detail-img svg{width:100%;height:100%;display:block}
  .detail-head{margin:16px 0 4px;font-weight:700;font-size:clamp(20px,2.6vw,28px);
    letter-spacing:-.01em;line-height:1.05;color:var(--ice)}
  .detail-sub{font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;
    letter-spacing:.22em;color:var(--dim);margin-bottom:16px}
  .info{border:1px solid var(--hair);background:var(--plate);padding:14px 16px;
    display:flex;flex-direction:column;gap:12px}
  .info div{display:flex;flex-direction:column;gap:5px}
  .info b{font-family:'Azeret Mono',ui-monospace,monospace;font-weight:400;
    font-size:8px;letter-spacing:.26em;color:var(--dim)}
  .info p{font-size:12.5px;line-height:1.55;color:var(--mute)}
  .info .row{flex-direction:row;gap:26px;flex-wrap:wrap}
  .info .row div{gap:4px}
  .info .row p{font-family:'Azeret Mono',ui-monospace,monospace;font-size:9.5px;
    letter-spacing:.14em;color:var(--ice)}

  /* ── real project media ───────────────────────────── */
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(1) contrast(1.04);
    transition:transform .55s cubic-bezier(.2,.8,.3,1),filter .55s ease}
  .card:hover .thumb img,.card:focus-visible .thumb img{filter:none;transform:scale(1.05)}

  .card .thumb video,.detail-img video{width:100%;height:100%;object-fit:cover;display:block}

  /* gallery — every image in a project folder, minus the cover */
  .gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;align-items:start}
  .gal[hidden]{display:none}
  .gal button{display:block;padding:0;background:transparent;
    border:1px solid var(--hair);overflow:hidden;line-height:0;transition:border-color .25s}
  .gal button:hover,.gal button:focus-visible{border-color:var(--line)}
  /* 10/7 only reserves space until the file loads; JS then swaps in the
     image's real ratio, so a portrait poster is never cropped to landscape. */
  .gal img{width:100%;height:auto;aspect-ratio:var(--media-ar,10/7);object-fit:contain;
    display:block;transition:transform .55s cubic-bezier(.2,.8,.3,1),opacity .5s ease,
      aspect-ratio .35s cubic-bezier(.2,.8,.3,1)}
  .gal button:hover img,.gal button:focus-visible img{transform:scale(1.04)}

  /* client logos — flattened to the HUD's monochrome, true colour on hover */
  .client img{width:100%;aspect-ratio:3/2;object-fit:contain;display:block;padding:15%;
    filter:grayscale(1) brightness(0) invert(1) opacity(.72);transition:filter .45s ease}
  .client:hover img{filter:none}
  body.light .client img{filter:grayscale(1) brightness(0) opacity(.72)}
  body.light .client:hover img{filter:none}

  .detail-img{position:relative}

  /* A video gets its own frame: 16:9 by default, corrected to the file's real
     ratio the moment metadata loads. `contain` then fits the whole frame —
     a wide video is never cropped at the sides to fill the 10/7 still box. */
  .detail-img.is-video{aspect-ratio:var(--media-ar,16/9)}
  .detail-img.is-video video{object-fit:contain;background:#000}

  /* Same idea for stills: the frame takes the photo's own ratio, so posters
     stay portrait instead of being cropped to 10/7. The ratio is normally
     known before the frame paints; `ar-soft` covers the rare late case by
     easing the correction instead of snapping it. */
  .detail-img.is-img{aspect-ratio:var(--media-ar,10/7)}
  .detail-img.is-img img{object-fit:contain}
  .detail-img.ar-soft{transition:aspect-ratio .35s cubic-bezier(.2,.8,.3,1)}

  /* A loading plate that reads as intentional, rather than a hollow box. */
  .detail-img.skel,.gal button.skel{background:
    linear-gradient(100deg,transparent 0 38%,var(--sheet) 50%,transparent 62% 100%),
    var(--plate);
    background-size:260% 100%,auto;background-repeat:no-repeat;
    animation:skelsweep 1.5s linear infinite}
  @keyframes skelsweep{from{background-position:160% 0,0 0}to{background-position:-60% 0,0 0}}

  /* The picture dissolves in over its own frame instead of popping. */
  .detail-img.is-img img{opacity:0;transition:opacity .5s ease}
  .gal img{opacity:0}
  .detail-img.is-img img.ready,.gal img.ready{opacity:1}

  .detail-img img{width:100%;height:100%;object-fit:cover;display:block}
  .detail-img img[role=button]:focus-visible{outline:1px solid var(--ice);outline-offset:-3px}
  .detail-img::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(to bottom,var(--scan) 0 1px,transparent 1px 3px);
    opacity:.45;mix-blend-mode:overlay}
  .play{position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-50%);
    display:flex;align-items:center;gap:10px;padding:11px 16px 11px 13px;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:9px;letter-spacing:.22em;
    color:var(--ice);background:var(--sheet);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-decoration:none;
    white-space:nowrap;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
    transition:color .25s,background .25s,border-color .25s,transform .3s cubic-bezier(.2,.8,.3,1)}
  .play svg{width:10px;height:10px;display:block;fill:currentColor}
  .play:hover,.play:focus-visible{color:var(--void);background:var(--ice);border-color:var(--ice);
    transform:translate(-50%,-50%) scale(1.06)}

  .info a{color:var(--ice);text-decoration:none;border-bottom:1px solid var(--line);
    transition:color .2s,border-color .2s}
  .info a:hover{color:var(--dim);border-color:var(--dim)}
  .info p + p{margin-top:4px}
  .info .tags{display:flex;flex-direction:row;flex-wrap:wrap;gap:6px}
  .info .tags span{font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;
    letter-spacing:.16em;color:var(--mute);border:1px solid var(--hair);padding:5px 8px;
    transition:border-color .25s,color .25s}
  .info .tags span:hover{border-color:var(--line);color:var(--ice)}

  /* no pointer to hover with — show the artwork as it is */
  @media (hover:none){
    .card .thumb img{filter:none}
  }

  /* ambient loops are decorative — hold the first frame instead */
  @media (prefers-reduced-motion:reduce){
    .card .thumb video,.detail-img video{animation:none}
    .detail-img.skel,.gal button.skel{animation:none;background:var(--plate)}
    .detail-img.ar-soft{transition:none}
    .gal img{transition:none}
  }

  /* ── boot ─────────────────────────────────────────── */
  .boot{position:fixed;inset:0;z-index:10;background:var(--void);display:grid;place-items:center;
    transition:opacity .6s ease,visibility .6s}
  .boot.gone{opacity:0;visibility:hidden}
  .boot-in{width:min(280px,60vw);display:flex;flex-direction:column;gap:11px;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.28em}
  .boot-t{color:var(--ice)}
  .boot-bar{height:2px;background:var(--hair);overflow:hidden}
  .boot-bar i{display:block;height:100%;width:0;background:var(--ice);box-shadow:0 0 12px var(--glow)}
  .boot-s{display:flex;justify-content:space-between;color:var(--dim)}
  .boot-s b{font-weight:400;color:var(--ice)}

  /* ── no-script fallback ───────────────────────────────
     Without the module nothing ever clears the boot screen, so the noscript
     copy — which tools/build-content.mjs writes from the same content.json
     the panels are built from — has to sit above it and bring its own
     scrolling back, the page body being overflow:hidden by design. */
  .seo{position:fixed;inset:0;z-index:20;overflow-y:auto;
    background:var(--void);color:var(--ice);
    padding:48px 24px 72px;max-width:760px;margin:0 auto;
    font-size:14px;line-height:1.7}
  .seo .seo-name{font-size:13px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ice);margin-bottom:4px}
  .seo h2{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ice);margin:40px 0 4px;padding-top:16px;border-top:1px solid var(--hair)}
  .seo h3{font-family:'Azeret Mono',ui-monospace,monospace;font-size:9px;font-weight:400;
    letter-spacing:.24em;color:var(--dim);margin:20px 0 6px}
  .seo p{margin:0 0 14px;color:var(--mute)}
  /* The alternate spellings, sitting between the name and the role in the same
     register as the role — but with none of its tracking: letter-spacing is
     inserted *between* joined letters and pulls a Persian word into glyphs. */
  .seo .seo-alt{font-family:'Azeret Mono',ui-monospace,monospace;font-size:9.5px;
    color:var(--dim);margin:0 0 4px}
  .seo .seo-role{font-family:'Azeret Mono',ui-monospace,monospace;font-size:9.5px;
    letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-bottom:28px}
  .seo a{color:var(--ice);text-decoration:underline;text-underline-offset:3px}
  .seo ul{margin:0 0 14px;padding-left:18px;color:var(--mute)}
  .seo li{margin:0 0 6px}
  .seo-work{list-style:none;padding:0;display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .seo-work li{margin:0}
  .seo-work img{display:block;width:100%;height:auto;border:1px solid var(--hair);margin-bottom:6px}
  .seo-work span{font-family:'Azeret Mono',ui-monospace,monospace;font-size:9px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

  /* ── lightbox ─────────────────────────────────────── */
  .lens{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;
    touch-action:none;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s}
  .lens.on{opacity:1;visibility:visible}
  .lens[hidden]{display:none}
  .lens-bg{position:absolute;inset:0;background:var(--lens);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .lens-stage{position:relative;z-index:1;margin:0;line-height:0;pointer-events:none;
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    padding:clamp(56px,9vh,96px) clamp(56px,7vw,112px)}
  .lens-stage img{display:block;width:auto;height:auto;
    max-width:min(100%,1400px);max-height:min(100%,1000px);object-fit:contain;
    border:1px solid var(--hair);opacity:0;transform:scale(.93);
    transition:transform .44s cubic-bezier(.2,.8,.3,1),opacity .3s ease}
  .lens.on .lens-stage img{opacity:1;transform:none}
  /* a pinch has to track the fingers exactly, so nothing is eased while they
     are down — the easing comes back for the settle and the way home */
  .lens.on .lens-stage.zoom img{transition:transform .3s cubic-bezier(.2,.8,.3,1),opacity .3s ease}
  .lens.on .lens-stage.live img{transition:none}
  .lens.on .lens-stage img.swap{opacity:0;transform:scale(.985);
    transition-duration:.15s,.15s}

  .lens-btn{position:absolute;z-index:2;display:grid;place-items:center;
    width:42px;height:42px;padding:0;line-height:1;
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:13px;
    color:var(--ice);background:var(--sheet);border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:color .2s,background .2s,border-color .2s}
  .lens-btn:hover,.lens-btn:focus-visible{color:var(--void);background:var(--ice);border-color:var(--ice)}
  .lens-btn[hidden]{display:none}
  .lens-btn .ico{--ico:16px}
  .lens-x{top:clamp(14px,3vw,26px);right:clamp(14px,3vw,26px)}
  .lens-prev{left:clamp(10px,2.4vw,26px);top:50%;transform:translateY(-50%)}
  .lens-next{right:clamp(10px,2.4vw,26px);top:50%;transform:translateY(-50%)}
  .lens-count{position:absolute;z-index:2;left:50%;transform:translateX(-50%);
    bottom:clamp(14px,3vw,26px);display:flex;gap:7px;align-items:baseline;
    padding:7px 11px;background:var(--sheet);border:1px solid var(--hair);
    font-family:'Azeret Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.22em;
    color:var(--dim)}
  .lens-count b{font-weight:400;color:var(--ice)}
  .lens-count i{font-style:normal}
  .lens-count[hidden]{display:none}

  /* ── rights line ──────────────────────────────────── */
  .rights{font-family:'Azeret Mono',ui-monospace,monospace;font-size:7.5px;
    letter-spacing:.2em;color:var(--dim);line-height:1.6;white-space:nowrap}

  /* on desktop, pull the rights line out of the right-hand stack and
     center it on the page, independent of the footer's own padding */
  @media (min-width:901px){
    .rights{position:fixed;left:50%;bottom:clamp(20px,3vw,36px);
      transform:translateX(-50%);z-index:4;
      transition:opacity .36s ease,visibility .36s}

    /* Centred on the page, the line runs under an open panel and is cut off
       mid-word — visible from 901px up to about 1200, where the panel is
       still 48vw and the line is still wide. Re-centring it on the free half
       only walks it into the readout at those same widths, so it stands
       down while the panel is up and comes back when the panel closes. */
    body.pan .rights{opacity:0;visibility:hidden}
  }


  @media (max-width:900px){
    .panel{width:100%;border-left:0}
    .grid{grid-template-columns:1fr}
    .card .meta{padding:14px 16px 15px}
    .panel-bar{padding:14px 16px}
    .view{padding:16px 16px max(20px,env(safe-area-inset-bottom))}
    .detail-head{font-size:22px;margin-top:14px}
    .who .shot{width:132px}
    .info p{font-size:12px}
  }
  @media (max-width:860px){
    .top{flex-direction:column;gap:16px}
    .bot{flex-direction:column;align-items:flex-start;gap:14px}
    .tail{align-items:flex-start}
    .readout span:nth-child(3){display:none}
  }

  /* ── small screens ────────────────────────────────── */
  @media (max-width:720px){
    .hud{padding:14px 14px max(14px,env(safe-area-inset-bottom))}
    .brackets{display:none}
    .top{gap:12px}
    .mark{gap:9px;--markh:calc(10.5px*1.5 + 2px + 7.5px*1.35)}
    .mark-name{font-size:10.5px;letter-spacing:.13em}
    .mark-sub{font-size:7.5px;letter-spacing:.2em;margin-top:2px}
    .menu{gap:6px}
    .hud .menu a,.hud .menu button{padding:8px 11px;font-size:8.5px;letter-spacing:.14em;gap:0}
    .hud .menu a i,.hud .menu button i{display:none}

    /* controls first, then the readout, with the rights line closing it out.
       display:contents lifts the tail's children into .bot so all three can
       be ordered against each other. */
    .bot{flex-direction:column;align-items:stretch;gap:12px}
    .tail{display:contents}
    /* The two switches are a pair — they are the only controls that change
       what the page looks like, and they are read together — so they stay
       together at the left edge and the audio toggle is pushed out to the
       right on its own. Spread evenly instead, the language buttons sat in
       the middle of the row with nothing either side of them: a floating
       third thing rather than the second half of a pair. It also settles the
       row: the audio label is the one control whose width changes on its own,
       and against the right edge it grows leftward into empty space instead
       of shoving its neighbours along. */
    .tools{order:1;justify-content:flex-start}
    .tools .sound{margin-left:auto}
    .readout{order:2}
    .rights{order:3}
    /* label and value read as one pair here rather than as a padded column —
       there is only the one row left by this width, so the column the label
       was holding open for the rows above it has nothing left to align to */
    .readout{font-size:8px;gap:4px}
    .readout span{gap:12px}
    .readout b{min-width:0}
    .readout span:nth-child(2){display:none}

    /* the ring flattens into a strip you can thumb through */
    /* the strip runs past both edges, so it says so: the ends dissolve
       instead of being guillotined, and a flick settles a chip under the
       thumb rather than stopping wherever the momentum ran out. */
    .explore{top:auto;left:0;right:0;height:auto;
      display:flex;gap:8px;align-items:center;padding:0 14px;
      overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;
      scroll-snap-type:x proximity;scroll-padding:0 14px;
      -webkit-mask-image:linear-gradient(to right,transparent 0,#000 18px,
        #000 calc(100% - 26px),transparent 100%);
      mask-image:linear-gradient(to right,transparent 0,#000 18px,
        #000 calc(100% - 26px),transparent 100%)}
    .explore::-webkit-scrollbar{display:none}
    .explore.on{pointer-events:auto}
    .chip{position:static;flex:0 0 auto;padding:10px 14px;font-size:9px;
      scroll-snap-align:center;transform:translateY(12px)}
    .explore.on .chip{transform:none}
    .chip.hot{transform:none}
    .who{grid-template-columns:1fr;gap:16px}
    .who > h3{margin-bottom:0}
    .who .shot{order:-1;width:min(64%,210px)}
    .clients{grid-template-columns:repeat(2,1fr)}

    /* the mark carries the meaning on its own here */
    #pclose .lbl{display:none}
    #pclose{width:30px;padding:0}
    .gal{grid-template-columns:1fr 1fr;gap:8px}

    .lens-stage{padding:60px 14px 84px}
    .lens-btn{width:44px;height:44px}
    .lens-prev,.lens-next{top:auto;bottom:calc(14px + env(safe-area-inset-bottom));transform:none}
    .lens-prev{left:14px}
    .lens-next{right:14px}
    .lens-count{bottom:calc(24px + env(safe-area-inset-bottom))}
    .rights{white-space:normal;font-size:7px}
  }

  @media (max-width:420px){
    .mark{--markh:calc(10.5px*1.5 + 2px + 7px*1.35)}
    .mark-sub{font-size:7px;letter-spacing:.16em}
    .hud .menu a,.hud .menu button{padding:8px 9px;font-size:8px}
    .hud .tgl b{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .sweep,.sound.live .bars i{animation:none}
  }
  /* ── the language switcher ────────────────────────────
     One control, one state per language, sized like the two beside it. Each
     label carries its own `lang`, so a language whose label is not Latin
     would still be handed to the right face rather than to whatever the
     Latin stack happens to have at that codepoint. */
  .hud .lang{display:flex;align-items:stretch;background:var(--plate);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    border:1px solid var(--hair);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
  .hud .lang button{padding:7px 9px;line-height:1;
    font-family:'Azeret Mono',ui-monospace,monospace;
    font-size:8.5px;letter-spacing:.2em;color:var(--dim);
    transition:color .25s,background .25s}
  .hud .lang button + button{border-inline-start:1px solid var(--hair)}
  .hud .lang button:hover{color:var(--ice)}
  .hud .lang button[aria-pressed=true]{color:var(--void);background:var(--ice)}
  /* the menu label is its own element so the numeral beside it survives a
     language change; it should still weigh what the button weighs */
  .hud .menu b{font-weight:inherit}

  /* ── the cheap tier ────────────────────────────────────────
     Three atmospherics that cost far more than they look like they should on
     an older phone. Every backdrop-filter is its own offscreen pass, and there
     are nine of them stacked over a canvas that is already redrawing; .grain
     is a full-screen mix-blend-mode layer, which forces the compositor to read
     the frame back; and .sweep animates a 140px band down the whole viewport
     forever, whether or not anyone is looking at it. What is left is the same
     page with slightly cleaner glass. */
  html.lo [class]{-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
  html.lo .grain{display:none}
  html.lo .sweep{display:none}
</style>
</head>

<script type="module">
import * as THREE from 'three';

/* ══ languages ════════════════════════════════════════════════════════════
   Two languages, one document. The build writes content.json per language —
   content.fr.json beside it — so switching is a fetch and a repaint rather
   than a reload, and the form behind the panel never has to be built twice.

   What lives here is only the chrome: the words the interface says about
   itself, which have no markdown file to come from. Everything a project or
   a client says comes down the wire with the content, already translated.
   The two are kept apart on purpose — a new project never touches this
   table, and a new label never touches projects/.

   The identifiers stay English throughout. `PAGES.ABOUT`, `data-page=ABOUT`,
   a shape's `key` and a verb's index are names the code holds onto; what a
   visitor reads is looked up from them at the moment it is painted.

   Both languages shipped here are Latin-script and left-to-right, and the
   stylesheet assumes it. A right-to-left language would need more than a row
   in this table: the panel's edge, the reticle's tag, the arrow rotations and
   the lightbox buttons all write a side down literally, and the interface's
   .2em tracking has to come off for any script whose letters join. */

const LOCALES = ['en', 'fr'];
const DEFAULT_LOCALE = 'en';

/* The switcher's own labels, each written in its own language — a person
   looking for their language finds it by recognising it, not by decoding an
   abbreviation in a language they do not read. */
const LOCALE_LABEL = { en: 'EN', fr: 'FR' };
const LOCALE_NAME  = { en: 'English', fr: 'Français' };

/* ── the verbs ────────────────────────────────────────────────────────────
   Three forms of one word: the imperative under the pointer, naming the act
   about to happen; the participle in the readout while it runs; and the same
   word once more when the shape is standing. English derives all three from
   one stem, because it can — the rule is regular enough to write down in two
   lines, and the comments below are the reasoning. The other languages are
   given their forms outright, since neither inflects in a way worth guessing
   at from a stem. */
const VERBS = ['MORPH','TRANSFORM','RESHAPE','EVOLVE','REFINE',
               'VISUALIZE','MATERIALIZE','ANIMATE','BUILD','DEFINE'];

/* The tag under the hand names the act about to happen, so it stays an
   imperative; the readout is describing the act while it runs, so it takes
   the participle. Every verb in the list ends either in a consonant or a
   silent e, which is the whole of the rule needed here. */
const ing = w => w.replace(/E$/, '') + 'ING';
/* and the same word again once the thing is done. The -ed is as regular as
   the -ing was, bar the one strong verb in the list, which is spelt out. */
const PAST = { BUILD: 'BUILT' };
const past = w => PAST[w] || w + (w.endsWith('E') ? 'D' : 'ED');

const EN_VERBS = VERBS.map(v => [v, ing(v), past(v)]);

const STRINGS = {
  en: {
    nav: { ABOUT: 'ABOUT', CLIENTS: 'CLIENTS', CONTACT: 'CONTACT' },
    readout: { form: 'FORM', practice: 'PRACTICE', render: 'RENDER', fps: 'FPS' },
    state: { unset: 'UNSET', relaxing: 'RELAXING', forming: 'FORMING', set: 'SET', form: 'FORM' },
    verbs: EN_VERBS,
    shapes: {},                       // the English keys are already the words
    cue: { hold: 'PRESS & HOLD',
           creed: 'ROUGH FIRST, THEN SET.\nLIKE EVERY PROJECT HERE.' },
    boot: { init: 'INITIALIZING', ready: 'READY' },
    tools: { light: 'LIGHT', dark: 'DARK',
             toDark: 'Switch to dark theme', toLight: 'Switch to light theme',
             standby: 'AUDIO STANDBY', on: 'AUDIO ON', off: 'AUDIO OFF',
             language: 'Language' },
    panel: { works: 'WORKS', top: 'TOP', index: 'INDEX', close: 'CLOSE', of: 'OF' },
    tag: { open: 'OPEN', view: 'VIEW', play: 'PLAY', next: 'NEXT', prev: 'PREV',
           close: 'CLOSE', back: 'BACK', email: 'EMAIL', theme: 'THEME',
           audio: 'AUDIO', lang: 'LANG', interact: 'INTERACT' },
    aria: { prev: 'Previous work', next: 'Next work', close: 'Close',
            prevImg: 'Previous image', nextImg: 'Next image',
            images: 'Project images', image: 'View image' },
    info: { brief: 'BRIEF', approach: 'APPROACH', client: 'CLIENT',
            clients: 'CLIENTS', role: 'ROLE', year: 'YEAR' },
    block: { elsewhere: 'ELSEWHERE', documents: 'DOCUMENTS', details: 'DETAILS',
             engagements: 'ENGAGEMENTS', skills: 'SKILLS',
             cv: 'CURRICULUM VITAE', pdf: 'PDF' },
    page: { profile: 'PROFILE', organisations: 'ORGANISATIONS', touch: 'GET IN TOUCH',
            lede: 'Open to commissions, collaborations and the occasional strange brief.',
            noLogos: 'Drop a logo into clients/ and it appears here.' },
    watch: 'WATCH',
    rights: 'ALL RIGHTS RESERVED',
    error: { sub: 'UNAVAILABLE', readout: 'CONTENT UNAVAILABLE',
             lede: 'The site index could not be loaded.',
             note: 'content.json is generated by tools/build-content.mjs. ' +
                   'Run <code>node tools/build-content.mjs</code>, then serve the folder ' +
                   'over HTTP (<code>npx serve</code>) rather than opening the file directly.' }
  },

  fr: {
    nav: { ABOUT: 'PROFIL', CLIENTS: 'CLIENTS', CONTACT: 'CONTACT' },
    readout: { form: 'FORME', practice: 'PRATIQUE', render: 'RENDU', fps: 'IPS' },
    state: { unset: 'BRUT', relaxing: 'RELÂCHE', forming: 'EN FORMATION',
             set: 'FIGÉ', form: 'FORME' },
    verbs: [
      ['MODELER',      'MODELAGE',        'MODELÉ'],
      ['TRANSFORMER',  'TRANSFORMATION',  'TRANSFORMÉ'],
      ['REMODELER',    'REMODELAGE',      'REMODELÉ'],
      ['ÉVOLUER',      'ÉVOLUTION',       'ÉVOLUÉ'],
      ['AFFINER',      'AFFINAGE',        'AFFINÉ'],
      ['VISUALISER',   'VISUALISATION',   'VISUALISÉ'],
      ['MATÉRIALISER', 'MATÉRIALISATION', 'MATÉRIALISÉ'],
      ['ANIMER',       'ANIMATION',       'ANIMÉ'],
      ['CONSTRUIRE',   'CONSTRUCTION',    'CONSTRUIT'],
      ['DÉFINIR',      'DÉFINITION',      'DÉFINI']
    ],
    shapes: { LOBE:'LOBE', STELLA:'STELLA', FACET:'FACETTE', FLUTE:'CANNELURE',
              SPINE:'ARÊTE', STUD:'PLOT', CROSS:'CROIX', COIL:'SPIRE',
              DISC:'DISQUE', TWIST:'TORSION', SHARD:'ÉCLAT', DIMPLE:'FOSSETTE' },
    cue: { hold: 'APPUYEZ & MAINTENEZ',
           creed: "D'ABORD BRUT, PUIS FIGÉ.\nCOMME CHAQUE PROJET ICI." },
    boot: { init: 'INITIALISATION', ready: 'PRÊT' },
    tools: { light: 'CLAIR', dark: 'SOMBRE',
             toDark: 'Passer au thème sombre', toLight: 'Passer au thème clair',
             standby: 'AUDIO EN VEILLE', on: 'AUDIO ACTIF', off: 'AUDIO COUPÉ',
             language: 'Langue' },
    panel: { works: 'PROJETS', top: 'HAUT', index: 'INDEX', close: 'FERMER', of: 'SUR' },
    tag: { open: 'OUVRIR', view: 'VOIR', play: 'LIRE', next: 'SUIV.', prev: 'PRÉC.',
           close: 'FERMER', back: 'RETOUR', email: 'EMAIL', theme: 'THÈME',
           audio: 'AUDIO', lang: 'LANGUE', interact: 'INTERAGIR' },
    aria: { prev: 'Projet précédent', next: 'Projet suivant', close: 'Fermer',
            prevImg: 'Image précédente', nextImg: 'Image suivante',
            images: 'Images du projet', image: "Voir l'image" },
    info: { brief: 'APERÇU', approach: 'APPROCHE', client: 'CLIENT',
            clients: 'CLIENTS', role: 'RÔLE', year: 'ANNÉE' },
    block: { elsewhere: 'AILLEURS', documents: 'DOCUMENTS', details: 'DÉTAILS',
             engagements: 'MISSIONS', skills: 'COMPÉTENCES',
             cv: 'CURRICULUM VITÆ', pdf: 'PDF' },
    page: { profile: 'PROFIL', organisations: 'ORGANISATIONS', touch: 'PRENDRE CONTACT',
            lede: 'Ouvert aux commandes, aux collaborations et aux briefs bizarres.',
            noLogos: 'Déposez un logo dans clients/ et il apparaît ici.' },
    watch: 'REGARDER',
    rights: 'TOUS DROITS RÉSERVÉS',
    error: { sub: 'INDISPONIBLE', readout: 'CONTENU INDISPONIBLE',
             lede: "L'index du site n'a pas pu être chargé.",
             note: 'content.json est généré par tools/build-content.mjs. ' +
                   'Lancez <code>node tools/build-content.mjs</code>, puis servez le dossier ' +
                   'en HTTP (<code>npx serve</code>) plutôt que d\'ouvrir le fichier directement.' }
  }
};

/* Where the language comes from — and only ever from a choice somebody made.
   The address is what this visit asked for; localStorage is what the last
   visit clicked. If neither says anything, the site opens in English.

   `navigator.languages` is deliberately not consulted. A browser's locale is
   set by the machine it was installed on, not by the person reading a
   portfolio, and letting it decide meant a first-time visitor could land in a
   language they never asked for, on a URL that says nothing about it — with
   the switcher the only clue that anything had been decided for them. One
   default, the same for everyone arriving, and the two buttons in the corner
   are the whole of the mechanism for changing it.

   A `?lang=` that names a language nobody has translated is not an error
   worth showing anyone — it simply does not match, and the search continues
   past it. */
function pickLocale(){
  const asked = new URLSearchParams(location.search).get('lang');
  if(asked && LOCALES.includes(asked)) return asked;

  let saved = null;
  try{ saved = localStorage.getItem('lang'); }catch(err){}
  if(saved && LOCALES.includes(saved)) return saved;

  return DEFAULT_LOCALE;
}

let LANG = pickLocale();

/* Spelt out rather than shortened to `T`, which is already taken: the theme
   functions bind `const T = TH()` for the palette, and a one-letter global
   would be silently shadowed there — the failure being a colour object
   asked for a word, several hundred lines from anything about language. */
let WORDS = STRINGS[LANG] || STRINGS[DEFAULT_LOCALE];

/* The chrome is painted from `WORDS` in a dozen places; this is the one that
   settles what the document itself is. It runs before the first frame, so
   the boot screen is already in the right language rather than flipping once
   the content arrives. */
function markDocument(){
  document.documentElement.lang = LANG;
}
markDocument();

/* ══ the hero ═════════════════════════════════════════════════════════════
   There is no model. Nothing is fetched, nothing is parsed, nothing waits on
   the network — the form is a sphere the shader moves, and every shape it can
   take is a function further down this file. The model/ folder and its
   loaders are gone with it, and so is the first-paint cost of three's GLTF
   loader, which was the largest thing this page used to download. */
const FIT = 3.0;                      // on-screen height of the form, world units
const BACK_Z = -6;

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

/* ── how much machine is under us ─────────────────────────────────
   A phone from 2017 runs this shader stack an order of magnitude slower than
   the machine it was written on, and the expensive decisions - the
   transmission pass, MSAA, the drawing buffer, the subdivision - are all made
   once, at construction, before a single frame has been drawn. So they are
   made from what the device will admit to: core count, memory, and a GPU
   string that names the chips of that era outright. No one of these is
   reliable alone - iOS reports no deviceMemory and masks the renderer - so any
   one is enough to trip the flag. The asymmetry is the point: a desktop
   wrongly put in the cheap tier loses a reflection nobody was looking at,
   while a phone wrongly left in the expensive one runs at twelve frames a
   second. When in doubt, be cheap. */
const lowEnd = (()=>{
  if(navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) return true;
  if(navigator.deviceMemory && navigator.deviceMemory <= 4) return true;
  try{
    const gl = document.createElement('canvas').getContext('webgl');
    if(!gl) return true;
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const r = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : '';
    // the GPUs that shipped in phones roughly 2015-2018
    if(/Adreno \(TM\) [3-5]|Mali-T|Mali-G5|PowerVR|Apple A([789]|10)\b/i.test(r)) return true;
  }catch(e){}
  return false;
})();
// the runtime half of the same idea: everything above is a guess made before
// the first frame, and on iOS it is a guess made almost blind. This one is not
// a guess - the frame loop sets it below if the page turns out to be slow
// whatever the guess said. Only the switches that can be thrown mid-flight
// read it; antialias, the shell's material and the subdivision are fixed at
// construction and cannot be taken back.
let cheap = lowEnd;
document.documentElement.classList.toggle('lo', lowEnd);

/* ══ renderer ═════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('gl');
// MSAA on a full-screen buffer is a poor trade on a tile-based mobile GPU, and
// next to the transmission pass below it is a rounding error of quality bought
// at a third of the frame rate
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !lowEnd });
// a phone gains nothing from a 3x buffer, and loses a third of its frame rate
// to it. At 1 the cheap tier shades a third of the pixels 1.75 would.
let DPR = Math.min(devicePixelRatio, lowEnd ? 1 : coarse ? 1.75 : 2);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = TH().exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(TH().bg);
const FOV = 34;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);

function envScene(cfg){
  const s = new THREE.Scene();
  s.background = new THREE.Color(cfg.back);
  const pg = new THREE.PlaneGeometry(1,1);
  const bar = (x,y,z,sx,sy,rx,ry,hex,mul)=>{
    const m = new THREE.Mesh(pg, new THREE.MeshBasicMaterial({ color:new THREE.Color(hex).multiplyScalar(mul), side:THREE.DoubleSide }));
    m.position.set(x,y,z); m.scale.set(sx,sy,1); m.rotation.set(rx,ry,0); s.add(m);
  };
  bar(0, 6, 0, 14, 8, Math.PI/2, 0, 0xffffff, cfg.key);
  bar(-6, 0.5, 1, 3.2, 9, 0, Math.PI/2, 0xf2f4f5, cfg.fill);
  bar(6, -0.5, -1, 2.4, 8, 0, -Math.PI/2, 0xaab6bd, cfg.rim);
  bar(0, -5, 2, 12, 6, -Math.PI/2, 0, 0x3a3e41, cfg.floor);
  bar(0, 0, -8, 16, 12, 0, 0, 0x1a1c1e, cfg.wall);
  return s;
}

const envCache = {};
function envFor(m){

  return envCache[m];

poster.position.z = BACK_Z;
